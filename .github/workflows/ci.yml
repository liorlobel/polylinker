name: CI

# Everything in this file has been run by hand at some point. That is exactly
# the problem it exists to fix: a number nobody re-checks is a number that
# quietly stops being true.
#
# Note what is *not* here: the .dna corpus. Those files are not redistributable
# (Addgene's terms are noncommercial-only with an anti-scraping clause, and lab
# files belong to their labs), so the corpus tests skip unless PL_CORPUS points
# somewhere. Everything below runs on synthetic or committed data.
#
# ---------------------------------------------------------------------------
# HOW THE TWO GATE FILES DIVIDE THE WORK, since 2026-08-09 and revised
# 2026-08-10.
#
# `tools/ci.ps1` is 77 steps and `docs/RELEASING.md` names it as the thing to
# run before tagging. (It said 73 here and below until the ARM64 port, then 75,
# which was already one short on the commit that wrote it; 76 is
# what `Step '` at column 0 counts to in the file today, and the two places this
# workflow repeats the number are exactly why a repeated number goes stale.)
# Until 2026-08-09 NO WORKFLOW INVOKED IT. It appeared in
# this file six times and every one of them was on a comment line. It had been
# failing on a clean tree since v0.1.2 and six releases were tagged with it red,
# because the only machine running it was the author's and the only evidence
# either way was a terminal nobody was looking at.
#
# It then ran on windows-latest only, which made "the gate passed" mean "passed
# on Windows" — and no sentence anywhere said so. Since 2026-08-10 the `gate`
# job is a three-runner matrix. The division that leaves is not "duplicate
# everything" and not "delete the second list" — it is this:
#
#   * `gate` (windows-latest, ubuntu-latest, macos-latest) is the authority. It
#     is the list `RELEASING.md` names, run whole, on all three platforms, with
#     its skips checked three ways: every skip must carry a reason its own
#     precondition declared, a platform reason must agree with the platform, and
#     the corpus skips must be exactly `.github/ci-expected-skips.txt`.
#   * `reconcile` compares the three legs. It is the only place a step that
#     skipped on all three can be seen, and the only place a step deleted from
#     one leg at file level can be seen.
#   * `test` runs on ubuntu-latest, macos-latest and windows-11-arm, and is NOT
#     redundant with the gate now that the gate runs there too: every cargo
#     invocation in it passes `--locked`, and no cargo invocation in the gate
#     does, so a rewritten lockfile is a red build here and nowhere else. It
#     also runs `pl-draw/tests/memory.rs` and `pl-features/tests/schema_pin.rs`,
#     which no step in the gate runs. Its windows-latest leg WAS deleted in
#     2026-08-09, which cost `--locked` on Windows; lock drift is a property of
#     the tree and not of the operating system, so two platforms was enough for
#     THAT. Its windows-11-arm leg is here for an entirely different reason and
#     is the subject of the section below.
#   * `msrv`, `wasm` and `oracles` stay. Each holds something the gate does not:
#     the toolchain floor, the wasm module driven against a Linux `pl`, and four
#     checks with no twin in the gate at all — the taint gate's FETCHING half,
#     the content sweep behind it, the offline end-to-end features build, and
#     the GenBank round-trip through Biopython. The taint gate's STRUCTURAL
#     half — `features/build/insdc_posture.py`, which needs no network — became
#     a step in `tools/ci.ps1` on 2026-08-10 and does have a twin now. The rest
#     of `oracles` is a second run of the differential checks under a different
#     Python and a different rendering stack, which for a rasteriser is coverage
#     and not repetition.
#
# ---------------------------------------------------------------------------
# WHERE ARM64 IS, WHY IT IS THERE, AND EXACTLY WHAT IT DOES NOT COVER.
#
# Windows on ARM became a shipped platform with v0.11.0. It is built and tested
# NATIVELY, on GitHub's `windows-11-arm` image, which is free for public
# repositories and this one is public. Nothing cross-compiles: rustc will build
# `aarch64-pc-windows-msvc` LIBRARY crates from an x64 Windows machine, but
# every binary in this workspace fails there with "linker `link.exe` not found"
# unless the ARM64 MSVC linker is installed, so no contributor can produce or
# run an ARM64 binary locally and CI is the only place this architecture is ever
# executed. That makes the honesty of the next two lists load-bearing rather
# than pedantic: there is no developer machine anywhere backing them up.
#
# IT IS IN `test`, NOT IN `gate`, and that is a decision with three reasons.
#
#   1. `test` is what proves the code RUNS on the architecture. The whole point
#      of a native leg is `cargo test --workspace --lib --bins`, plus the seven
#      integration suites below, executing as aarch64 machine code. The gate
#      contains a great deal that is not that.
#   2. A fourth `gate` leg would BREAK `reconcile` and could not be fixed from
#      this file. `tools/reconcile-ledgers.ps1` requires exactly three ledgers
#      (it exits on any other count) and its rule X1a requires the set of
#      platforms they declare to be exactly the three it knows -- and rejects a
#      duplicate in terms, "a duplicate is two runs of one platform standing in
#      for three". Two Windows legs are that duplicate unless `tools/ci.ps1`'s
#      platform stamp learns to distinguish architectures. Both files would have
#      to change together, and until they did, every push would be red for a
#      reason that is not about the tree.
#   3. A `gate` leg on ARM64 could PASS WITHOUT BUILDING THE MSI, which is the
#      failure this repository has shipped nine fixes for, arriving through the
#      front door. The `windows-11-arm` image does not carry a WiX toolset, and
#      the gate's two MSI steps are written to skip themselves when `wix` is
#      absent rather than fail -- correctly, for a contributor without a .NET
#      SDK. `-ExpectedSkips` would accept that skip: its reason is declared by
#      the step's own precondition (L1), it is not a platform reason so there is
#      nothing for L2 to disagree with, and it is not a corpus skip so L3's set
#      equality never sees it. The reconciler's X2 would accept it too, because
#      the step still ran on the x64 leg. So the ARM64 leg would print GATE
#      PASSED having never built or installed the installer this platform is
#      shipping, and no rule anywhere would say so. The packaging steps added to
#      `test` instead are plain unconditional `run:` lines with no skip
#      vocabulary in them at all: no WiX is a red step, full stop.
#
# WHAT THE ARM64 LEG ACTUALLY RUNS, as a list, because prose about coverage is
# how coverage claims go stale:
#
#     cargo fmt --all --check
#     cargo clippy --workspace --all-targets --locked
#     cargo test --workspace --lib --bins --locked
#     cargo build --workspace --release --locked
#     pl-fileio --tests, pl-features --test corpus, --test schema_pin,
#     pl-draw --test agreement zstream pngfile glyphs render memory,
#     pl-design --tests, pl-update (whole crate), pl --test cli
#     tools/release.ps1 -> tools/check-archive.ps1
#     tools/build-msi.ps1 -> tools/check-msi.ps1, per-user AND per-machine
#
# WHAT IT DOES NOT RUN. Every one of these runs on windows-latest and on NO
# ARM64 machine anywhere, and a sentence in the README that does not account for
# them is a false sentence:
#
#   * `tools/ci.ps1` as a list -- 77 steps, its ledger, and the whole skip
#     discipline. There is no ARM64 ledger, so `reconcile` says nothing about
#     this platform.
#   * THE GUI IS NEVER LAUNCHED. Not on this leg, not on any leg, on any
#     platform. Everything below builds `polylinker.exe`, packages it, installs
#     it and uninstalls it, and nothing anywhere starts it and watches it come
#     up. That gap shipped a release: v0.11.1's ARM64 build cannot open a window
#     on a Windows-on-ARM machine, because those devices carry no OpenGL driver
#     and `egui_glow` requires OpenGL 2.0+ -- a first-frame failure that every
#     build, test, package and install step here passes straight over. It is not
#     obvious this is fixable on a hosted runner: a GPU-less VM answers a GL
#     request with the OpenGL 1.1 software renderer, so a naive "launch it and
#     see" step would fail on windows-latest too and for the same reason, which
#     is presumably why no such step was ever written. What IS testable, and now
#     is, is that the failure SAYS something -- see
#     `startup_failure_message` in bins/pl-gui/src/main.rs and its two tests.
#   * the PE assertions: the icon and version resource in the built binaries.
#   * the 8.3 short-name alias case.
#   * the differential oracles -- SEGUID, zlib, Pillow, fontTools, resvg, the
#     SciPy gel spline, the PDF/SVG comparison, the chromatogram checks. Those
#     live in `gate` and in `oracles`, and `oracles` is ubuntu-latest only, so
#     they are not "missing on ARM64" so much as "on one platform, which is not
#     this one".
#   * the wasm32 build, the wasm self-checks and the pl-index purity build.
#   * the TypeScript typecheck and the renderer-agreement fixture regeneration.
#   * the release-workflow YAML checks.
#   * `msrv`, `wasm` and `oracles` as jobs. All three are ubuntu-latest by
#     design and always have been; none of them is a per-architecture claim.
#
# So the true sentence about ARM64, in the shape a user should read it: the code
# is compiled and its test suite is run on real Windows-on-ARM hardware, and the
# zip and MSI are built, installed, checked and uninstalled there. The oracles
# and the artefact-property checks that the x64 build gets are not run on it.
# ---------------------------------------------------------------------------
#
# WHAT THE MATRIX MUST NOT COST, stated up front because it is the whole risk:
# the Windows leg is what has stood between a mistake and a published release,
# and a port that turns one of its steps into a skip, loosens an assertion so it
# holds everywhere, or makes an unconditional check conditional would be worse
# than not porting at all. Seven steps are Windows-only and say so in their own
# preconditions; every other step that ran on Windows before still runs there.
#
# `tools/ci.ps1` step 'every integration suite is run by a gate' is what keeps
# that division honest: it reads the tree, and every `tests/*.rs` target under
# `crates/` and `bins/` must be run, unfiltered, by one of these two files.
#
# THE NETWORK, decided rather than inherited. The `gate` job needs it only to
# provision -- cargo's registry, pip, npm, the WiX tool -- and those are steps of
# their own, before the gate, where an outage is a red install step and not a
# silent SKIP. The gate itself fetches from no third-party data source, so there
# is nothing in it to make non-fatal: the live-source build left this file on
# 2026-08-07 for `features-live.yml`, after EBI timed out twice and turned main
# red over commits that had nothing to do with it. The one job here that still
# reaches a service nobody here operates is `oracles`, at its taint-gate step,
# and that stays exactly as it is -- it fails CLOSED, on purpose, because
# "could not check" and "checked and clean" are different results and that step
# is the concrete evidence behind this project's central licensing claim. An
# outage there is a false red on a rare day; making it non-fatal would be a
# permanent false green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `RUSTFLAGS: -D warnings` USED TO BE HERE, AND IT SILENTLY UNDID
  # .cargo/config.toml.
  #
  # Cargo does not merge the two. A `RUSTFLAGS` environment variable REPLACES
  # `[target.<triple>] rustflags` from the config file, so setting it at workflow
  # level discarded `-C target-feature=+crt-static` for every job here. Measured
  # on the author's machine, building the same crate twice into separate target
  # directories:
  #
  #   RUSTFLAGS unset       pl-mcp.exe imports KERNEL32.dll
  #   RUSTFLAGS='-D warnings'  pl-mcp.exe imports VCRUNTIME140.dll AND
  #                            api-ms-win-crt-runtime-l1-1-0.dll
  #
  # That is precisely the dependency `.cargo/config.toml` exists to remove: the
  # VC++ redistributable needs administrator rights, and `docs/PLAN.md:120` names
  # a user who does not have them. The gate step 'no C runtime redistributable is
  # needed' has always checked for it -- but it is preconditioned on a release
  # directory, so it was one of the seven steps that skipped when the release
  # step died, and it had therefore NEVER RUN ON A RUNNER. The first run in which
  # it executed, 31329432359, failed on it. Nothing was broken by that change;
  # the check simply reached the binaries for the first time.
  #
  # So the variable moves down to the jobs that want it, and the `gate` job --
  # the only one here that builds Windows binaries, and the one whose whole
  # purpose is to check properties of the artefacts that ship -- does not set it.
  # It is not a lint hole: `tools/ci.ps1` Step 'clippy' runs
  # `cargo clippy --workspace --all-targets -- -D warnings`, and `-D warnings`
  # passed to clippy denies ordinary rustc lints too, not just clippy's own.
  # Checked: a crate whose only fault is an unused variable exits 101 under that
  # command with RUSTFLAGS unset.
  #
  # `release.yml` sets no RUSTFLAGS either, and now for two reasons rather than
  # one -- see the note in its `env:` block for the first.

jobs:
  # THE GATE. `tools/ci.ps1`, whole, with its skips checked.
  #
  # A MATRIX SINCE 2026-08-10, and the sentence that used to be here is worth
  # keeping in view: "windows-latest and not a matrix, because the script is a
  # Windows script. It hardcodes `target/release/pl.exe` at twenty-one call
  # sites ... reads PE resource directories ... drives `msiexec` and `HKCU` ...
  # and passes `$env:TEMP` to `Join-Path`, which off Windows is a null argument
  # and a terminating error." Every symptom in it was real; the count was not,
  # and that is itself the lesson — the actual figures at the time of the port
  # were 25 `pl.exe` sites in 18 steps and 17 unguarded `$env:TEMP` uses, both
  # measured rather than remembered.
  #
  # Every one of those has now been fixed by SPELLING rather than by skipping:
  # an `$exe` suffix, `[IO.Path]::GetTempPath()`, a three-way `.pyd`/`.so`/
  # `.dylib` table, `tar$exe`. Seven steps genuinely cannot run off Windows --
  # PE resources, an 8.3 short name, the registry, msiexec -- and each of those
  # says so in its own precondition, where it is checked against `$IsWindows`
  # rather than believed.
  #
  # WHAT THE MATRIX MUST NOT DO IS WEAKEN THE WINDOWS LEG, which is the leg that
  # has been standing between a mistake and a published release since
  # 2026-08-09. A weaker check that runs in three places is not progress over a
  # strong one that runs in one. `fail-fast: false`, so a Linux failure does not
  # cancel Windows and hide what it would have said.
  #
  # 77 steps. Five skip everywhere for want of a corpus
  # (`.github/ci-expected-skips.txt`); seven more skip off Windows and say why.
  # The `reconcile` job below is what checks the three legs against each other,
  # and it is the only place a step that skipped on ALL THREE can be seen.
  #
  # STILL THREE LEGS AFTER THE ARM64 PORT, AND THAT IS DELIBERATE. windows-11-arm
  # is not here; it is a leg of `test` below. The three reasons are set out in
  # this file's header under "WHERE ARM64 IS" -- the short form is that
  # `tools/reconcile-ledgers.ps1` accepts exactly three ledgers and rejects two
  # legs claiming one platform, and that the gate's MSI steps are allowed to
  # skip when WiX is absent, which on the ARM image would mean a green gate that
  # never built the installer that platform ships. `windows-latest` here is
  # therefore still an x64 claim and only an x64 claim. Nothing in this job says
  # anything about aarch64.
  gate:
    name: the gate (tools/ci.ps1) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    # The gate builds the workspace in release, builds it again for a dozen
    # integration targets, renders rasters, and installs an MSI twice. Four
    # minutes on a warm developer machine with everything already compiled is
    # not the number to size a cold runner on.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # Four gate steps are preconditioned on `rustup target list
          # --installed` containing this, and three of them are not on the
          # expected-skip list: the wasm32 build, the wasm self-checks and the
          # pl-index purity build. No runner image ships the target, so without
          # this line all three SKIP and the job goes red saying so. (The
          # fourth, the wasm-versus-native comparison, needs a corpus and is on
          # the list.)
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # THE PROVISIONING BELOW IS THE POINT OF THE JOB, not scaffolding for it.
      #
      # A gate job on a stock runner would print GATE PASSED having skipped
      # every step that needs Python, node, the wasm target, WiX or a `dist/`,
      # which is over half of them -- a more convincing version of the failure
      # being fixed, because it comes with a green check. Every install here
      # turns steps from SKIP into ok, and `-ExpectedSkips` at the end is what
      # stops that quietly going backwards.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The `oracles` job installs the first seven. The last four are what makes
      # three gate steps possible at all -- scipy for the gel calibration spline
      # against SciPy, pymupdf and pypdf for 'PDF is a PDF, and matches the
      # SVG', PyYAML for 'the release workflow parses and covers three
      # platforms'. Those three steps are gate-only and the gate ran nowhere, so
      # until now they had never executed in CI on any platform.
      #
      # All eleven have Windows wheels; verified on the author's machine, where
      # every one of them imports and no step gated on them skipped. They are
      # installed identically on all three legs, deliberately: a missing wheel
      # on one platform is a step that skips with no declared reason there, and
      # -ExpectedSkips turns that into a red build rather than a grey line.
      - name: Install the oracles
        run: pip install biopython seguid pydna pillow fonttools resvg-py numpy scipy pymupdf pypdf PyYAML

      # `node --test --experimental-strip-types test/*.test.ts` needs Node 22.6
      # or newer, and `Have node` is true on any of them -- so on an image with
      # Node 20 the two TypeScript steps would FAIL rather than skip. Pinned to
      # the major the fixture was generated with, because 'renderers agree
      # (fixture is current)' regenerates `crates/pl-draw/tests/agreement.json`
      # and compares it to the committed bytes.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `packages/circular-map/node_modules` is gitignored, so it is absent on
      # every fresh checkout and the `typecheck` step is preconditioned on it
      # existing. `npm ci` installs from the committed lockfile; the only
      # dependency is TypeScript itself.
      - name: Install the TypeScript toolchain
        working-directory: packages/circular-map
        run: npm ci

      # Same version and same extension as release.yml installs, deliberately:
      # the gate step builds an MSI with `tools/build-msi.ps1` and the release
      # builds it with the same script, and an installer that changes shape
      # between the two would make the gate's answer worthless.
      #
      # WINDOWS ONLY, and this is the one conditional install in the job. The
      # two MSI steps declare 'not windows' off Windows and skip there whatever
      # is installed, so a `dotnet tool install` on Linux would be three minutes
      # buying nothing. Every other install above is unconditional precisely so
      # that a skip off Windows can only mean the platform and never the
      # provisioning.
      - name: Install the WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'installing wix failed' }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'adding the WiX UI extension failed' }
          wix --version

      # dist/, because two gate steps are preconditioned on
      # `dist/SHA256SUMS.txt` existing: the one proving the MSI is generated
      # from the manifest rather than from a second file list, and the one that
      # actually installs it. On a developer machine that directory is there
      # because they have cut a release into it at some point. On a runner
      # nothing creates it, so both steps would skip -- which is how the MSI
      # install test came to be one of the six skipped for six releases.
      #
      # This is `tools/release.ps1` with its default `-Out dist`, which is the
      # same invocation release.yml uses, so nothing here is a CI-only path.
      # `/dist/` is gitignored, so the working tree stays clean underneath it.
      #
      # Windows only, for the same reason as WiX above: both steps that read it
      # declare 'not windows' elsewhere. It stays a separate step rather than
      # being folded into the gate, because a failure here should read as a red
      # provisioning step and not as a red gate.
      - name: Assemble dist/, which the two MSI steps read
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/release.ps1 -Out dist -Quiet
          if (-not (Test-Path dist/SHA256SUMS.txt)) {
            Write-Host '::error::release.ps1 produced no dist/SHA256SUMS.txt, so the two MSI steps would silently skip'
            exit 1
          }

      # THE EXIT-CODE PATH, PROVED BEFORE IT IS RELIED ON.
      #
      # The whole job rests on a red gate turning into a red build, and
      # PowerShell exit codes through a `run:` step are a genuine trap: a cmdlet
      # does not set $LASTEXITCODE at all, so a failure that arrives as a thrown
      # object rather than as a process exit can leave the variable holding the
      # 0 from whatever ran before. `tools/ci.ps1` documents four distinct ways
      # that bit it INSIDE its own step bodies -- three in the comment on `Step`
      # and a fourth on `CargoTest` -- and every one was found by audit rather
      # than by a red gate. Assuming the same mechanism is sound one level
      # further out, in the shell that invokes the script, would be the same
      # assumption that let this file reference the gate in six comments and run
      # it in none.
      #
      # Two halves, because they are two different mechanisms and one probe
      # cannot fail for both:
      #
      #   1. `pwsh -NoProfile -File <script>` reports the script's own `exit N`
      #      as $LASTEXITCODE in the caller. Checked here, and a fail is a fail.
      #   2. A `run:` step that exits non-zero is recorded as a failed step.
      #      Checked below with a step that deliberately exits 7 under
      #      `continue-on-error`, and a following step that fails the job unless
      #      that step's outcome was `failure`.
      - name: A script's exit code survives `pwsh -File`  (control 1 of 2)
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'exit-probe.ps1'
          Set-Content -LiteralPath $probe -Value 'exit 7'
          pwsh -NoProfile -File $probe
          $code = $LASTEXITCODE
          # CAPTURE, THEN CLEAR, THEN JUDGE -- and leave by an explicit exit.
          #
          # The first version of this step read $LASTEXITCODE directly and ended
          # after Write-Host. It failed on run 31325299019 with its own success
          # message in the log: `shell: pwsh` runs the block and then appends
          # `exit $LASTEXITCODE`, so the probe's 7 was still sitting there when
          # the step ended. The step therefore went red BECAUSE the propagation
          # it exists to verify had worked -- a control that fails on success,
          # which is the same species of useless as one that cannot fail at all.
          #
          # Clearing the variable and ending with an explicit `exit` makes this
          # step's result depend on its own judgement rather than on how the
          # shell derives an exit code from a variable the step is deliberately
          # leaving dirty.
          $global:LASTEXITCODE = 0
          if ($code -ne 7) {
            Write-Host "::error::a script that exited 7 came back as $code; the gate's failures would not reach this job"
            exit 1
          }
          Write-Host 'a script exiting 7 arrives as 7'
          exit 0

      - name: A step that exits non-zero is a failed step  (control 2 of 2)
        id: nonzero-exit
        continue-on-error: true
        shell: pwsh
        run: exit 7

      - name: ...and this job noticed it  (control 2 of 2, checked)
        shell: pwsh
        run: |
          $outcome = '${{ steps.nonzero-exit.outcome }}'
          if ($outcome -ne 'failure') {
            Write-Host "::error::a pwsh step that exited 7 was recorded as '$outcome'; a red gate would not turn this build red"
            exit 1
          }
          Write-Host 'a step exiting 7 was recorded as a failure'

      # THE GATE, and the assertion that it ran.
      #
      # -ExpectedSkips turns three claims into checked ones rather than grey
      # text nobody reads: every skip must carry a reason its own precondition
      # declared, a platform reason must agree with the platform, and the steps
      # that skipped for want of a corpus must be exactly the committed list --
      # set equality in both directions, not a count, because a count of five is
      # satisfied by the wrong five skipping.
      #
      # -Ledger writes what this leg did, for the `reconcile` job. It is written
      # even when the gate fails, which is why it is a separate `if: always()`
      # upload step below rather than a second command here.
      #
      # `exit $LASTEXITCODE` explicitly. GitHub appends its own
      # `if (Test-Path variable:\LASTEXITCODE) { exit $LASTEXITCODE }` to a pwsh
      # step, which would do the same thing here, but only for as long as the
      # last statement in this block stays a native call. Saying it is one line
      # and removes the dependency on nobody ever adding a `Write-Host` below.
      - name: The gate
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/ci.ps1 `
            -ExpectedSkips "$env:GITHUB_WORKSPACE/.github/ci-expected-skips.txt" `
            -Ledger "$env:GITHUB_WORKSPACE/ledger.tsv"
          exit $LASTEXITCODE

      # ALWAYS, because a leg that went red still has a true record of what it
      # ran -- and "did this step run anywhere" is exactly the question a failed
      # leg can still answer. Without `always()` the reconciler would only ever
      # see runs where nothing was wrong, which is the population in which it
      # has nothing to find.
      - name: Upload this leg's ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-${{ matrix.os }}
          path: ledger.tsv
          if-no-files-found: error

  # THE THREE LEGS, AGAINST EACH OTHER.
  #
  # Each leg checks its own skips and cannot see the others. The case that only
  # exists once the gate runs in three places is a step that skipped on ALL
  # THREE -- 'not windows' on two legs is only honest if the third one ran it --
  # and no leg can tell. `tools/reconcile-ledgers.ps1` is where that is checked,
  # along with the three legs carrying the same step names in the same order,
  # which is what catches a step made conditional at file level on one platform.
  #
  # `needs: gate` is for ordering only, and the condition is `!cancelled()`
  # rather than `always()`: a red leg still uploads a true ledger and a Windows
  # failure must not stop the reconciler reporting that a step ran nowhere, but
  # a CANCELLED run has no ledgers to compare and would fail here for a reason
  # that is not about the tree. The job has its own self-test, run first,
  # because a reconciler whose parser stopped matching reports every push clean.
  reconcile:
    name: the three legs agree about what ran
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: The reconciler can fail
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/reconcile-ledgers.ps1 -SelfTest
          exit $LASTEXITCODE

      - uses: actions/download-artifact@v4
        with:
          pattern: ledger-*
          path: ledgers

      # `-LedgerDir`, NOT `-Ledger $found`. Under `pwsh -File` an array
      # parameter binds only its first argument and PowerShell then rejects the
      # rest with "a positional parameter cannot be found" -- measured against
      # three real ledgers. `pwsh -File` is deliberate here, because it is the
      # exit-code path the gate job's own two control steps prove, so the
      # directory form exists in the script rather than a workaround existing
      # here. The script counts the files it found and says so if there are not
      # three.
      - name: Reconcile
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/reconcile-ledgers.ps1 -LedgerDir ledgers
          exit $LASTEXITCODE

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # THIS JOB SETS NO `RUSTFLAGS`, and that is the whole point of the change
    # that removed it on 2026-08-15.
    #
    # It used to set `RUSTFLAGS: -D warnings`, to carry the deny across
    # `cargo build` and `cargo test` rather than only across clippy. The comment
    # here argued that was safe because .cargo/config.toml declared rustflags for
    # exactly one triple, `x86_64-pc-windows-msvc`, which is not in this matrix
    # -- so there was nothing on the ARM64 leg for the variable to discard. It
    # then said, in as many words, that the day somebody added the
    # `[target.aarch64-pc-windows-msvc]` crt-static block the ARM64 download
    # needs, this job would go red and say what to do about it.
    #
    # That day was 2026-08-15 and it went exactly that way: the guard step below
    # is what refuses the combination, and its message names two remedies. This
    # is the first of them -- move the deny off the job. The second, folding the
    # config's flags into the variable's value, was rejected because it makes
    # `ci.yml` carry a second copy of a codegen flag whose single source of truth
    # is `.cargo/config.toml`, and a copy that must be edited whenever that file
    # changes is the shape of defect this repository keeps finding.
    #
    # IT IS NOT A LINT HOLE, and the reasoning is this file's own, already
    # measured for the `gate` job in the `env:` block at the top: `-D warnings`
    # on clippy's command line denies ordinary rustc lints too, not only clippy's
    # own, and `--all-targets` reaches tests, benches and examples. A crate whose
    # only fault is an unused variable exits 101 under that command with
    # RUSTFLAGS unset. The Clippy step below therefore passes it explicitly, the
    # same way `tools/ci.ps1` Step 'clippy' does, and this job now matches both
    # the `gate` job and `release.yml` in setting no RUSTFLAGS at all.
    #
    # What this buys: the ARM64 leg builds with the flags `release.yml` builds
    # with, which is the only way `windows-arm64` binaries get a static CRT.
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is deliberately absent: the `gate` job above runs
        # ALMOST every one of the steps below, on the same runner image, as part
        # of the list `docs/RELEASING.md` names. Three exceptions, and they are
        # the reason this job exists at all rather than being deleted:
        # `--locked`, `pl-draw/tests/memory.rs` and
        # `pl-features/tests/schema_pin.rs`, none of which any step in the gate
        # carries. See the division set out in this file's header, including
        # what dropping the Windows leg cost.
        #
        # windows-11-arm IS PRESENT, and it is not a reversal of that decision.
        # windows-latest is absent because the gate covers it; the gate covers
        # NOTHING on aarch64, so for that architecture this job is not the
        # smaller of two lists, it is the only list. It is also the only place
        # in this repository where ARM64 code is executed at all -- see "WHERE
        # ARM64 IS" in the header for the three-reason justification and for the
        # explicit list of what this leg does NOT cover.
        #
        # Free for public repositories, which this one is. If the label ever
        # stops resolving, the job cannot report success: `needs`-less as it is,
        # a job that never runs is not a green check on the pull request. The
        # precise presentation -- immediate error or a job that queues until it
        # times out -- is not verified here and the first run will show it.
        os: [ubuntu-latest, macos-latest, windows-11-arm]
    # ADDED 2026-08-19, AFTER A LEG OF THIS JOB SPENT 3h39m DOING NOTHING.
    #
    # `gate` has had a ceiling since it was written and `reconcile` has one;
    # this job had none, so its ceiling was GitHub's default of six hours. On
    # 2026-08-19 the ubuntu leg wedged inside `apt-get update` in the step
    # below, 74 seconds in, on `archive.ubuntu.com noble-security InRelease`.
    # It never reached cargo. Nothing in the tree was wrong and nothing could
    # go red: a job with no output and no ceiling is indistinguishable from a
    # slow one, which is the shape of defect this repository keeps finding
    # wearing yet another hat. It was still sitting there when a human
    # cancelled it, and would have sat for two hours more.
    #
    # 45 rather than a tighter number, because the honest measurements are of
    # WARM runs and this must not go red on a cold one. Six complete legs, all
    # green, across two runs:
    #
    #   run 31997998145 (2026-08-17)  ubuntu 8m08s  macos 7m43s  arm 12m44s
    #   run 32270926926 (2026-08-19)  ubuntu 11m12s macos 8m06s  arm 13m06s
    #
    # So 45 is 3.4x the slowest leg ever observed here and half of what `gate`
    # -- which does strictly more -- is already allowed. A cache miss or a cold
    # runner has room; a hang does not. The number this replaces was 360.
    #
    # This is not a performance budget and must not be tightened into one. Its
    # only job is to turn a wedged runner into a red check in under an hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # THE ONE WAY THIS JOB'S `env:` CAN GO WRONG, CHECKED ON THE LEG WHERE IT
      # CAN GO WRONG.
      #
      # `RUSTFLAGS: -D warnings` at job level replaces, rather than merges with,
      # any `[target.<triple>] rustflags` in .cargo/config.toml -- measured, and
      # recorded in this file's `env:` block, where setting it workflow-wide
      # silently removed `-C target-feature=+crt-static` from the Windows `gate`
      # job and put a VC++ redistributable dependency back into binaries built
      # there. Nothing about the program behaves differently when that happens;
      # the failure appears only on a locked-down machine nobody here owns.
      #
      # WHY THIS EXISTS AS A STEP RATHER THAN A COMMENT, and what it caught.
      # The ARM64 download needs a `[target.aarch64-pc-windows-msvc]` block with
      # the same crt-static flag. It did not have one until 2026-08-15, so every
      # ARM64 binary in v0.11.0 links the dynamic CRT and imports
      # VCRUNTIME140.dll -- measured on the published artifacts, with the x64
      # build of the same release clean on all four as the control. When the
      # block was added, this step is what refused the combination, because a
      # job-level `RUSTFLAGS` would have discarded it again and produced exactly
      # the same broken binaries with the fix apparently applied. The remedy it
      # names is now in force: this job sets no RUSTFLAGS.
      #
      # It stays, and it is not now vacuous. It fails if anyone reintroduces the
      # variable, which is the specific regression that would silently undo the
      # fix, and it fails if its own parser stops matching. What it cannot do is
      # prove the resulting binaries are clean -- that needs the bytes, and the
      # step 'no ARM64 binary needs the VC++ redistributable' below reads them.
      #
      # HOW IT FAILS, both directions:
      #   * add rustflags for the host triple to .cargo/config.toml while this
      #     job sets RUSTFLAGS -> red, naming the discarded flags.
      #   * edit .cargo/config.toml so the parser below matches nothing -> red,
      #     because a sweep that found no `[target.` block at all has checked
      #     nothing and must not report clean. There is one such block in the
      #     file today (x86_64-pc-windows-msvc) and this leg is not that triple,
      #     which is exactly why the vacuity guard is needed: without it the step
      #     would pass on a file it had failed to read.
      - name: RUSTFLAGS is not silently discarding .cargo/config.toml
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cfg = '.cargo/config.toml'
          if (-not (Test-Path -LiteralPath $cfg)) { throw "there is no $cfg, so this step read nothing" }

          # A deliberately small parser: `[target.<triple>]` headers and the
          # `rustflags = [...]` line under each. It does not need to understand
          # TOML, it needs to notice a triple gaining flags.
          $blocks = @{}
          $current = $null
          foreach ($line in (Get-Content -LiteralPath $cfg)) {
              if ($line -match '^\s*\[target\.([^\]]+)\]') { $current = $Matches[1]; continue }
              elseif ($line -match '^\s*\[')               { $current = $null; continue }
              if ($current -and $line -match '^\s*rustflags\s*=\s*(.+)$') { $blocks[$current] = $Matches[1].Trim() }
          }
          if ($blocks.Count -eq 0) {
              throw ("no [target.<triple>] rustflags were found in $cfg. That file has carried a " +
                     'crt-static block for x86_64-pc-windows-msvc since 2026-08-05, so finding none ' +
                     'means this parser has stopped matching and the check below would pass on anything.')
          }

          # Read rather than hard-coded: a triple typed into this file would be
          # a second copy of a fact rustc already knows, and it is the fact the
          # comparison turns on.
          $hostLine = @(rustc -vV | Select-String -Pattern '^host:\s*(\S+)')
          if ($hostLine.Count -ne 1) {
              throw "rustc -vV printed $($hostLine.Count) host: lines; this step cannot say which triple it is checking"
          }
          $host_triple = $hostLine[0].Matches[0].Groups[1].Value
          Write-Host "host triple: $host_triple"
          Write-Host "$cfg declares rustflags for: $($blocks.Keys -join ', ')"

          if ($blocks.ContainsKey($host_triple)) {
              if ($env:RUSTFLAGS) {
                  throw ("$cfg declares rustflags for $host_triple -- $($blocks[$host_triple]) -- and this job " +
                         "sets RUSTFLAGS='$env:RUSTFLAGS'. Cargo REPLACES the config's target rustflags with the " +
                         'environment variable rather than merging them, so those flags are being discarded here ' +
                         'and this leg is not building what release.yml builds. Move the deny off this job (clippy ' +
                         "is given -D warnings on its own command line and denies rustc's lints too), or fold the " +
                         'config flags into the value.')
              }
              Write-Host "RUSTFLAGS is unset, so $cfg's flags for $host_triple apply"
          } else {
              Write-Host "$cfg declares nothing for $host_triple, so RUSTFLAGS discards nothing on this leg"
          }

      # eframe needs system libraries on Linux; macOS ships its own. The `if`
      # stays rather than becoming unconditional: this matrix has had three
      # entries and now has two, and a step that says which platform it is for
      # survives the next edit to that list.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      # `--locked` on every cargo invocation that resolves, from here down.
      #
      # Committing Cargo.lock is most of the fix, but not all of it: cargo will
      # quietly rewrite the lock whenever it decides it has to, and a CI run that
      # rewrites the lock is back to testing a graph nobody chose. `--locked`
      # turns that into an error instead, so the job either builds exactly the
      # dependency set in the commit or fails saying it could not.
      #
      # It also makes an upstream yank or a Cargo.toml edit that outgrows the
      # lock visible as a CI failure rather than as a silent version bump.
      - name: Format
        run: cargo fmt --all --check

      # `-- -D warnings` on the command line, not `RUSTFLAGS` in the job's env.
      # See the block at the top of this job: the variable would replace
      # .cargo/config.toml's `[target.<triple>] rustflags` outright, which on the
      # ARM64 leg means building without the static CRT the download needs.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib --bins --locked

      - name: Build release
        run: cargo build --workspace --release --locked

      # ALL of pl-fileio's integration targets, not just `corpus`.
      #
      # This named `--test corpus` alone, and `tests/notes_report.rs` was
      # therefore run by nothing -- not here, and not in tools/ci.ps1, whose
      # pl-fileio step was corpus-gated and skipped on any machine without the
      # lab drive. Its four tests are the only cover for lib.rs:221, the line
      # that carries the unrepresentable-notes report from `Document` to
      # `LoadReport`; the file's own header records that replacing it with
      # `Vec::new()` left `cargo test --workspace` green, and `pl info` and
      # `pl convert` would then silently stop telling the user which part of a
      # .dna's Notes block was dropped.
      #
      # `--tests` rather than a second `--test` name, so the next file added
      # under tests/ is run the day it is written. The corpus tests still skip
      # cleanly with PL_CORPUS unset, which running them here still proves.
      - name: File I/O integration suites (corpus cases skip without a corpus)
        run: cargo test -p pl-fileio --tests --locked -- --nocapture

      # `--lib --bins` above excludes every integration suite, and this is the
      # one that independently validates the shipped data: the nt->aa
      # translation of every coding row, and the schema, duplicate and
      # licensed-provenance audit. Both were green locally and absent from CI,
      # and the gap widened five-fold when the table grew from 8 rows to 70.
      # Two of its five tests are PL_CORPUS-gated and skip cleanly here, the
      # same pattern as the step above; the other three read features.tsv
      # directly and do the work.
      #
      # No name filter, here or in tools/ci.ps1. The local gate used to run this
      # target twice with one filter each, and one of those filters named a test
      # that had been renamed, so it selected nothing and printed ok --
      # `cargo test` exits 0 when a filter matches nothing.
      - name: Feature database, against the shipped table
        run: cargo test -p pl-features --test corpus --locked -- --nocapture

      # The two schema definitions, in two languages, compared directly. The
      # pin used to work only through the generated header, so a Python-side
      # column rename left the whole suite green until somebody rebuilt.
      - name: The Python builder and the Rust loader agree on the schema
        run: cargo test -p pl-features --test schema_pin --locked -- --nocapture

      # The same gap as the note four steps up, found again and this time on
      # pl-draw. `--lib --bins` excludes these, so `tests/agreement.rs` -- the
      # harness comparing this renderer against the TypeScript one, function by
      # function -- had never run IN CI, on any platform, from the day it was
      # written until this step; `zstream.rs` and `pngfile.rs` would have joined
      # it there.
      #
      # "In CI", precisely, and not the stronger sentence: the gate does run it
      # -- `tools/ci.ps1`, `Step 'renderers agree (rust replays it)'`, and it
      # was there at 713bd3b too -- so until 2026-08-09 it had been running on
      # one developer's machine, on one OS, and only when `node` is installed,
      # which is the step's precondition. It now runs in the `gate` job as well,
      # where `node` is installed on purpose and a skip is a failure. Where the
      # stronger claim is true it is written in full: see the `pl-design` note
      # below, "had never run in CI or in the local gate, on any platform".
      #
      # These write the artefacts that the Python cross-checks in `tools/ci.ps1`
      # then judge. Running them here does not run those checks; it proves the
      # writers themselves work on the two platforms this job covers, which
      # together with the `gate` job on windows-latest is all three -- and a
      # raster is where they are most likely to differ.
      #
      # `memory` is the exception and the only one: no step in the gate names
      # it, so of these six suites it is the one that runs on two platforms
      # rather than three. It counts `Layout` sizes -- what the program asked
      # the allocator for, not what any allocator returned -- so there is no
      # operating system in the number it measures.
      #
      # `memory` was missing from this list and named nowhere else either: a
      # grep for it over .github/ and tools/ returned nothing, so the one test
      # that measures what a PNG export really asks the allocator for was run by
      # no gate. What it holds is `PNG_BYTES_PER_PIXEL` (lib.rs:1566), which
      # every other mention of is prose: deflate.rs's per-input-byte arithmetic,
      # and the refusal `MAX_PIXELS` hands the user, which multiplies by it to
      # say the export "would need about N GB of memory" (lib.rs:1624, 1633).
      # A counting allocator across a real png_at is the only thing that
      # measures it.
      #
      # Every other pl-draw suite is named on this line, which is exactly how
      # one of them goes unnoticed. tools/ci.ps1 now carries a step that refuses
      # the next such omission by reading the tree instead of a list.
      - name: Drawing, compression and PNG integration suites
        run: cargo test -p pl-draw --test agreement --test zstream --test pngfile --test glyphs --test render --test memory --locked

      # The same gap a third time, and this one had gone all the way: a grep
      # for `pl-design` over `.github/` and `tools/` returned zero hits, so
      # `crates/pl-design/tests/` -- design, determinism, purity, refusals,
      # scoring, specificity_prefilter, 45 tests -- had never run in CI or in
      # the local gate, on any platform.
      #
      # `purity.rs` is the one that matters most here, because it is the only
      # enforcement left: it reads the crate's own sources and rejects std::fs,
      # std::env, std::process, std::net, the ambient clocks, HashMap/HashSet
      # (RandomState is seeded per process, so a report ordered by a hash
      # iteration differs between runs) and `partial_cmp`. The wasm32 job below
      # is not a backstop for it -- it builds `pl-wasm` and `pl-index`, and
      # `pl-wasm` does not depend on `pl-design`. `determinism.rs` is the other
      # one: nothing else asserts that two runs of one input agree byte for
      # byte, which is the guarantee the whole crate is built around.
      - name: Primer design integration suites
        run: cargo test -p pl-design --tests --locked

      # The compiled-in release public key, and the updater that reads it.
      #
      # No `--tests` filter, unlike the steps above, and it used to have one:
      # when `crates/pl-update` was three constants and no code, every test it
      # had was an integration test. It now has both, so the whole crate is run
      # here. `--lib --bins` above would reach the unit tests and not the four
      # integration suites, which are the ones holding docs/RELEASING.md's
      # requirements 1 and 4.
      #
      # Nothing else in this repository reads `RELEASE_PUBLIC_KEY`, so without
      # this a wrong nibble among its 32 byte literals compiles, links and
      # ships, and is first noticed by a user whose updater refuses a genuine
      # release -- or does not refuse a forged one. And `tests/handoff.rs` is
      # the only thing anywhere that holds the two requirements which are claims
      # about what the crate does NOT do: no thread, no timer, no clock, no
      # program run but `curl`, nothing that copies over or launches what it
      # downloaded. Those cannot be caught by calling anything -- a version that
      # launched the installer would pass every functional test in the crate --
      # so they are checked by reading the sources, here.
      #
      # It also pins the coupling `release.yml` relies on: that workflow greps
      # the key's base64 form out of `crates/pl-update/src/lib.rs`, so that the
      # signature it makes is verified against the key that actually ships
      # rather than against a second copy pasted into YAML. A doc-comment edit
      # adding a second base64 token would break a release that cannot be
      # rehearsed after the tag is pushed; this says so on the pull request.
      - name: The release key, and the updater that reads it
        run: cargo test -p pl-update --locked

      # The binary, from the outside. `bins/pl/tests/cli.rs`, all 53 tests.
      #
      # This workflow never tested package `pl` at all -- it only built it --
      # and the single line in tools/ci.ps1 that reached the target passed a
      # name filter selecting one test. So 52 ran on no machine in any gate.
      #
      # What that left unenforced is not hypothetical. `bins/pl/Cargo.toml`
      # names `only_the_update_verb_can_reach_the_network` (cli.rs:2383) as the
      # mechanism holding the project's promise that exactly one verb touches
      # the network: it reads the binary's own source and fails if a call into
      # `pl_update` appears outside `cmd_update`. Nothing else holds it --
      # pl-update's `handoff.rs` reads only its own crate. Adding
      # `let _ = pl_update::curl_available();` to `cmd_info` compiles, passes
      # clippy, builds a release, and was green in both gates. The same file is
      # the regression suite for the previous audit's data-loss findings, each
      # of which shipped once.
      #
      # Cheap and portable: no corpus, no Python, no node, 13s locally, and the
      # tests write only under `std::env::temp_dir()`.
      - name: The pl binary, from the outside
        run: cargo test -p pl --test cli --locked

      # ----------------------------------------------------------------- ARM64
      #
      # THE PACKAGING PATH, REHEARSED ON THE ONE PLATFORM NOBODY CAN REHEARSE IT
      # ON LOCALLY.
      #
      # Everything above is `cargo`. The four steps below are the release path:
      # `release.ps1` -> `check-archive.ps1` -> `build-msi.ps1` ->
      # `check-msi.ps1`, which is what `release.yml` runs against a pushed tag,
      # and what `tools/ci.ps1` rehearses on windows-latest as part of the gate.
      #
      # ON ARM64 THE GATE REHEARSES NOTHING, because `gate` is a three-runner
      # matrix and none of them is Windows-on-ARM -- see "WHERE ARM64 IS" in
      # this file's header for why adding a fourth leg there is not the answer.
      # Without these steps, the first time an ARM64 zip is packed, checked,
      # turned into an MSI, installed and uninstalled would be inside a release
      # run, after a tag had been pushed and could not be un-pushed.
      # `release.yml`'s own header states the rule this violates: "A release
      # workflow is not where to test a hypothesis." That rule binds harder
      # here than anywhere else in the repository, because the maintainer's
      # machine cannot link an ARM64 binary at all -- rustc cross-compiles the
      # library crates and every binary dies with "linker `link.exe` not found"
      # -- so there is no local run to fall back on and no way to reproduce a
      # failure after the fact.
      #
      # WINDOWS-GUARDED, NOT ARM-GUARDED, and on purpose. `runner.os` is
      # `Windows` on windows-11-arm and would be on a windows-latest leg too, so
      # if x64 ever returns to this matrix it gets the same rehearsal rather
      # than an `if` somebody has to remember to widen.
      #
      # NOTHING HERE MAY SKIP. The gate's MSI steps are allowed to skip when
      # `wix` is absent, which is right for a contributor without a .NET SDK and
      # would be wrong here: these are plain `run:` lines with no precondition
      # and no skip vocabulary, so a WiX that will not install on aarch64 is a
      # red step naming WiX. That is the whole reason ARM64 is in this job
      # rather than in the gate.

      # Same version and same extension as release.yml and the gate install.
      # An installer that changes shape between the rehearsal and the release
      # makes the rehearsal worthless.
      #
      # UNVERIFIED ON THIS IMAGE. The `windows-11-arm` image manifest lists WiX
      # among the tools it does NOT carry, so this line is the only thing that
      # puts one there. WiX has supported ARM64 natively since v4 and ships as
      # an architecture-independent .NET tool, which is why it is expected to
      # work -- but it has not run here yet, and if it cannot, this step is
      # where that is discovered, on a pull request, rather than on a tag.
      - name: Install the WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'installing wix failed' }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'adding the WiX UI extension failed' }
          wix --version

      # `./tools/release.ps1 -Out dist` with no -PlatformLabel and no
      # -ArchiveFormat: byte-identical to what release.yml runs on a Windows
      # runner, so nothing here is a CI-only path. The label is derived by the
      # script from `RuntimeInformation::OSArchitecture` (release.ps1:164-172),
      # which already knows `Arm64`, and the assertion below is what proves it
      # derived the one this platform ships under rather than defaulting to x64
      # somewhere. `/dist/` is gitignored, so the working tree stays clean.
      #
      # HOW IT FAILS: an ARM64 runner that produced `...-windows-x64.zip`, or a
      # zip whose internal SHA256SUMS.txt does not describe its own contents, or
      # one missing a licence text. That last is not hypothetical: seven licence
      # files went missing from the archive on 2026-07-30, which is why
      # check-archive.ps1 exists and why it is run here on the bytes rather than
      # on the dist/ directory they came from.
      - name: Package this platform, and check the archive from the outside
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/release.ps1 -Out dist -Quiet
          if (-not (Test-Path dist/SHA256SUMS.txt)) {
              throw 'release.ps1 produced no dist/SHA256SUMS.txt'
          }

          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          $wantLabel = switch ("$arch") {
              'X64'   { 'windows-x64' }
              'Arm64' { 'windows-arm64' }
              default { throw "this runner reports OSArchitecture '$arch' and no archive name is defined for it" }
          }
          $stated = ''
          foreach ($line in (Get-Content 'dist/SHA256SUMS.txt')) {
              if ($line -match '^platform:\s*(\S+)') { $stated = $Matches[1]; break }
          }
          if (-not $stated) { throw 'dist/SHA256SUMS.txt carries no platform: line, so this step could not tell what was packaged' }
          if ($stated -ne $wantLabel) {
              throw ("this runner is $arch and the manifest says it packaged '$stated'; it should say '$wantLabel'. " +
                     'release.yml names the artifact from the same label, so a wrong one here is a wrong download name there.')
          }

          $archive = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' })
          if ($archive.Count -ne 1) { throw "expected exactly one archive in dist/, found $($archive.Count)" }
          if ($archive[0].Extension -ne '.zip') {
              throw ("release.ps1's default format on Windows produced $($archive[0].Name); release.yml passes no " +
                     '-ArchiveFormat, so the default IS what ships and a zip is what the release notes tell a ' +
                     'Windows reader to download.')
          }
          ./tools/check-archive.ps1 -Archive $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'the archive failed its check' }

      # THE ONE CHECK THIS LEG EXISTS FOR, and the one whose absence shipped a
      # broken download.
      #
      # v0.11.0's four ARM64 binaries all import VCRUNTIME140.dll, because
      # .cargo/config.toml scoped `+crt-static` to `x86_64-pc-windows-msvc` and
      # named no aarch64 triple. Nothing went red. The step that asserts the
      # absence of that import, 'no C runtime redistributable is needed', is a
      # step of tools/ci.ps1, and the gate runs on windows-latest, ubuntu-latest
      # and macos-latest -- so the single architecture whose flags were missing
      # was the single architecture no caller of that scan could reach. The flag
      # is a one-line fix; the reason it was needed for four days is this gap.
      #
      # It scans `dist/`, the staged payload the archive above was built from,
      # so it reads the bytes that would actually ship rather than a debug build
      # or an intermediate. It is the same tools/check-crt.ps1 the gate calls,
      # invoked rather than transcribed, and it carries its own vacuity guard: a
      # run that finds fewer than four binaries throws instead of passing, which
      # is what stops it from going quietly green if `dist/` is ever empty or
      # renamed.
      #
      # WindowsOnly by `runner.os`, not by architecture: the x64 legs of this
      # matrix do not exist, but if one is ever added the check is right for it
      # too, and the four banned names cannot appear in a Linux or macOS build.
      - name: No ARM64 binary needs the VC++ redistributable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/check-crt.ps1 -Dir dist

      # The installer, built and then actually installed, asserted against the
      # disk and the registry, uninstalled, and asserted again -- both scopes,
      # per-user first because that is the one readers get by default.
      #
      # This is the only place an ARM64 MSI is exercised at all before a tag.
      # `build-msi.ps1` takes its file list AND its platform from
      # dist/SHA256SUMS.txt rather than from any argument, so there is no
      # architecture named on this line either; if it still hard-codes x64 it
      # produces `polylinker-<v>-windows-x64.msi` here and the name check fails.
      # `-Out msi`, never `dist/`: an .msi left in dist/ would be swept into the
      # manifest and then into the zip. `msi` and not a temp directory, so this
      # is the same invocation release.yml makes rather than a near-miss of it.
      # `/dist/` and `msi/` are both gitignored -- `msi/` was added in the same
      # change as this step -- so this leaves nothing untracked behind. It would
      # cost nothing either way, because no step in this job asserts a clean
      # working tree and the runner is destroyed afterwards.
      - name: Build the MSI, install it, check it, uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/build-msi.ps1 -Dist dist -Out msi
          if ($LASTEXITCODE -ne 0) { throw 'building the MSI failed' }

          $version = ''
          $label = ''
          foreach ($line in (Get-Content 'dist/SHA256SUMS.txt')) {
              if ($line -match '^version:\s*(\S+)')  { $version = $Matches[1] }
              if ($line -match '^platform:\s*(\S+)') { $label   = $Matches[1] }
          }
          if (-not $version -or -not $label) { throw 'dist/SHA256SUMS.txt is missing its version: or platform: line' }

          $msi = @(Get-ChildItem msi -Filter *.msi)
          if ($msi.Count -ne 1) { throw "expected exactly one .msi, found $($msi.Count)" }
          $want = "polylinker-$version-$label.msi"
          if ($msi[0].Name -ne $want) {
              throw ("the MSI is called $($msi[0].Name) and this platform packages as $label, so it should be $want. " +
                     'release.yml publishes both Windows installers into one flattened directory, so two legs ' +
                     'producing one name would silently overwrite each other there.')
          }

          ./tools/check-msi.ps1 -Msi $msi[0].FullName -Dist dist -PerUser
          if ($LASTEXITCODE -ne 0) { throw 'the MSI failed its check in the per-user scope, which is the default one' }
          ./tools/check-msi.ps1 -Msi $msi[0].FullName -Dist dist
          if ($LASTEXITCODE -ne 0) { throw 'the MSI failed its check in the per-machine scope' }

  # The oldest toolchain this workspace claims to build on, actually building it.
  #
  # `rust-version` in the root Cargo.toml read 1.82 for as long as the workspace
  # has existed and no job had ever used it: the matrix above is
  # `dtolnay/rust-toolchain@stable`, and stable was 1.97.1 when this was
  # written. That number is not decoration -- `tools/readme/README-LINUX.txt`
  # sends the reader whose glibc is too old for the Linux binaries to build from
  # source and names the toolchain they will need -- so it was advice nobody had
  # tried. It was also wrong: cargo 1.82 refuses `indexmap 2.14.0`'s manifest for
  # being edition 2024, before compiling a line.
  msrv:
    name: rust-version floor
    runs-on: ubuntu-latest
    # Deliberate, and the note on the `cargo check` step below already explains
    # it: an old rustc warning about code that stable accepts silently is still
    # something a reader following README-LINUX.txt will meet. Linux, so nothing
    # to replace.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      # The version is NOT written in this file. A toolchain pinned here would
      # be a second copy of a number whose first copy is what users read, and
      # two copies of a number is how the first one stopped being true. This
      # installs whatever the manifest declares, and fails if it declares
      # nothing rather than silently falling back to stable -- a floor job
      # running on stable is the exact vacuity it exists to end.
      - name: The floor, read out of Cargo.toml
        id: floor
        run: |
          v=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          [ -n "$v" ] || { echo "::error::the root Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "the declared floor is $v"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      # `check`, and deliberately not `test`. The claim is that this tree
      # COMPILES on the toolchain it tells people to install; whether it also
      # passes 1,757 tests on a toolchain nobody ships on is a different and
      # much more expensive question, and the matrix above already answers the
      # part that matters.
      #
      # `--locked` carries more weight here than in any other step. The floor is
      # set by the dependency graph and not by this workspace's own code -- what
      # rejected 1.91 was eight egui 0.35 crates declaring 1.92 -- so a resolver
      # free to pick different versions would be measuring a different floor
      # from the one that ships.
      #
      # `RUSTFLAGS: -D warnings` is set on this job, and that is intended: an old
      # rustc warning about code stable accepts silently is still something a
      # reader following README-LINUX.txt will meet. (It was at the top of this
      # file until 2026-08-09, where it also reached the Windows `gate` job and
      # replaced .cargo/config.toml's rustflags there -- see the `env:` block.)
      - name: cargo check on the declared floor
        run: cargo check --workspace --locked

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the browser core
        run: cargo build -p pl-wasm --target wasm32-unknown-unknown --profile wasm --locked
      - name: Drive the real module
        run: |
          cargo build -p pl --release --locked
          node crates/pl-wasm/tests/drive_wasm.mjs \
            target/wasm32-unknown-unknown/wasm/pl_wasm.wasm \
            target/release/pl

  oracles:
    name: differential tests and benchmark
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The whole point of these jobs: our answers are checked against tools
      # that are not ours.
      - name: Install the oracles
        run: pip install biopython seguid pydna pillow fonttools resvg-py numpy

      - name: Build
        run: cargo build -p pl --release --locked

      - name: SEGUID checksums vs the reference implementation
        run: python reference/python/tests/xcheck_seguid.py target/release/pl

      # `pl-draw` hand-writes DEFLATE, because `crates/` take no dependencies
      # and a PNG needs one. Its own tests round-trip against an `inflate`
      # written from RFC 1951 in this repository, which catches nearly
      # everything and cannot catch the two of them misreading the spec the same
      # way. `zlib` is the reference implementation, by other people, and is
      # what will open these files. Checked one-shot and then a byte at a time,
      # because a stream can decode correctly in one call and still be malformed
      # for an incremental reader -- measured: appending four bytes was accepted
      # by all ten one-shot decodes and rejected by all ten streaming ones.
      - name: zlib streams vs zlib
        run: |
          cargo test -q -p pl-draw --test zstream --locked
          python reference/python/tests/xcheck_deflate.py .

      # Pillow is a different PNG decoder and stands in for every program that
      # will open these figures. Every pixel is compared against the raw RGB
      # buffer written beside the file, never against a re-encode.
      #
      # Measured limit, worth knowing before anyone calls the unit tests
      # redundant with this: corrupting IDAT's CRC left Pillow opening the file
      # with every pixel still matching. Pillow does not verify it. The Rust
      # test `every_chunk_carries_the_right_crc` is the only cover for that.
      - name: PNGs vs Pillow
        run: |
          cargo test -q -p pl-draw --test pngfile --locked
          python reference/python/tests/xcheck_png.py .

      # `font.rs` walks the `glyf` table by hand and nothing in this repository
      # can check that walk -- a test reading `glyf` the way `font.rs` reads it
      # agrees with itself by construction. fontTools is another implementation
      # by other people, and the implied on-curve point is expanded by ITS
      # `BasePen`, not re-derived here, so the rule under test is not a second
      # copy of our own reasoning. It found two real off-by-ones in this reader
      # before it first passed, both invisible in a rendered glyph.
      - name: Glyph outlines vs fontTools
        run: |
          cargo test -q -p pl-draw --test glyphs --locked
          python reference/python/tests/xcheck_glyphs.py .

      # The whole raster against an independent SVG renderer, handed the SVG
      # this crate emits and forced onto the same two font files it fills
      # outlines from. The discriminator is WHERE the pixels differ, not how
      # many: two correct antialiasing implementations disagree along edges and
      # nowhere else, so every grossly differing pixel must sit on a gradient.
      # A wrong arc, a wrong winding, a misplaced glyph or a hole in a stroke
      # all put differing pixels in flat regions instead.
      - name: The raster vs resvg
        run: |
          cargo test -q -p pl-draw --test render --locked
          python reference/python/tests/xcheck_render.py .

      # The taskbar button of a RUNNING window does not come from the .exe's
      # icon resource: winit never reads it, and `ViewportBuilder::with_icon`
      # takes raw RGBA rather than a .ico. So bins/pl-gui/icon/ holds two
      # generated artefacts from one master. This decodes the .ico's 64 px frame
      # with Pillow and compares all 16,384 bytes against the blob the window is
      # handed, then compares every frame against a fresh resvg render of the
      # master. main.rs's two sha256 prove the pair came out of one run of
      # build-icon.py; only this compares a pixel.
      - name: The window icon vs the .ico
        run: python reference/python/tests/xcheck_icon.py .

      - name: Digest fragments and PCR vs pydna
        run: python reference/python/tests/xcheck_clone.py target/release/pl

      - name: GenBank output is readable by Biopython
        run: |
          python - <<'PY'
          import subprocess, tempfile, os
          from Bio import SeqIO
          gb = subprocess.run(
              ["target/release/pl", "convert", "prototype/demo-construct.gb",
               "--to", "genbank", "--stdout"],
              capture_output=True, text=True, check=True).stdout
          with tempfile.NamedTemporaryFile("w", suffix=".gb", delete=False,
                                           encoding="utf-8", newline="\n") as fh:
              fh.write(gb); path = fh.name
          rec = SeqIO.read(path, "genbank")
          os.unlink(path)
          print(f"biopython read it back: {len(rec.seq)} bp, {len(rec.features)} features")
          assert len(rec.seq) == 3180, len(rec.seq)
          PY

      # The benchmark is committed, synthetic and CC0, so it runs anywhere.
      # A regression that drops the score fails the build.
      - name: polylinker-bench
        run: |
          python bench/run.py bench/polylinker-bench.json \
            -- target/release/pl bench-adapter | tee /tmp/bench.txt
          grep -qE "^all +176 +0 +0 +176 +100\.0%" /tmp/bench.txt \
            || { echo "::error::bench score changed — update the expected line if intended"; exit 1; }

      - name: The benchmark regenerates identically
        run: |
          python bench/generate.py > /tmp/regen.json
          diff -q bench/polylinker-bench.json /tmp/regen.json \
            || { echo "::error::generate.py is no longer deterministic"; exit 1; }

      # "AI may propose, never assert", checked against the files on disk by a
      # program that knows nothing about how they were written, and that plants
      # each forbidden edit into the real table first and requires itself to
      # catch it. It was local-only; a rule nobody runs is a rule.
      #
      # The rule did not change when the PI turned curator sign-off on
      # (2026-07-28); the mechanism did. A row may sit above `proposed` only if
      # features/SIGNOFF.tsv names it with a content digest that still matches.
      # This step used to be called "Every feature row is proposed, with no
      # curator", which is a statement about the data rather than about the rule
      # -- and it would have had to be deleted the first time a curator signed
      # anything, which is exactly when it is most needed.
      - name: No feature row asserts more than a human signed
        run: python features/build/check_signoff.py

      # The control that makes the sign-off file mean anything: THE BUILD NEVER
      # WRITES IT. Nothing about the hash prevents a machine writing a
      # valid-looking signature, because the digest is computed from the content
      # and authenticates nobody -- its job is stale-approval detection. What
      # stops a machine signing a row is that the only program that could is not
      # allowed to touch the file, and this proves it rather than asserting it.
      # That is the distinction Db::audit's own comment draws about the NO_GO
      # list: discipline is not a control.
      #
      # THIS STEP USED TO NEED THE NETWORK, AND THAT WAS A DEFECT IN THE GATE
      # RATHER THAN A COST OF IT. It ran the real build against live EBI, NCBI,
      # UniProt and RCSB. On 2026-08-07 EBI timed out twice in a row -- first on
      # AAB47270.1, then on AAB59737.1 -- and both times the build died inside a
      # stage, never reached `write_outputs`, and tripped this step's own
      # vacuity guard. The guard was right to fire: nothing had been checked. But
      # main went red twice for a reason no commit under test had anything to do
      # with, which is the worst thing a gate can do, because a red that means
      # nothing teaches people that red means nothing.
      #
      # The property is unchanged and is now checked TWICE, both times offline:
      #
      #   1. `check_writer.py` runs the real `write_outputs` over every row of
      #      the real table with the real signatures applied, and proves it
      #      emits no SIGNOFF.tsv at any depth, leaves features/SIGNOFF.tsv
      #      byte-identical, and writes exactly the statuses the sign-off
      #      granted. It plants five misbehaving writers first and requires
      #      itself to catch each one, so it cannot pass by doing nothing. It
      #      also checks the clause this step is NAMED for and never tested:
      #      that the build *reads* the file at all. Since 2026-08-10 that
      #      table also carries UNSIGNED rows -- 115 rows against 89
      #      signatures -- so this run is strictly stronger than when it was
      #      written: "writes 'proposed' where no signature exists" is now a
      #      case with real data behind it and not only a planted one.
      #
      #   2. The step below runs the whole program end to end, which is the part
      #      1 cannot cover -- `write_outputs` being clean says nothing about
      #      some other code path in build.py reaching for the file.
      #
      # What was genuinely lost: the live build no longer proves on every push
      # that the writer behaves when driven by freshly fetched rows. That runs
      # on a schedule instead, in the `features-live` job below, where an EBI
      # outage costs a notification rather than a false accusation against a
      # commit.
      - name: The build's writer reads SIGNOFF.tsv and never writes it
        run: python features/build/check_writer.py

      # End to end, with PLF_OFFLINE set so `fetch` refuses the network instead
      # of hoping for it. On a clean runner the cache is empty (features/build/
      # .cache/ is gitignored), so every stage reports its source unavailable and
      # the build exits 3 having contributed no rows -- and `write_outputs` still
      # runs, which is the whole point. This is hermetic BY CONSTRUCTION: the
      # result is identical whether or not EBI is up.
      #
      # The existence of features.tsv is still what proves the writer ran, and it
      # still cannot pass vacuously when the build dies early. Only now it cannot
      # be made to die early by somebody else's outage.
      - name: The build program emits no SIGNOFF.tsv, offline
        run: |
          # `rc=0; cmd || rc=$?`, not `cmd; rc=$?`. GitHub runs this under
          # `bash -e`, so a non-zero exit that is not part of a condition kills
          # the step at that line -- and offline the build exits 3 by design, so
          # the naive form would never reach a single assertion below and the
          # step would fail while reporting nothing. Exactly the vacuity this
          # step is built to refuse, arriving through the shell instead.
          rc=0
          PLF_OFFLINE=1 PLF_BUILD_DATE=1970-01-01 \
            python features/build/build.py --out /tmp/plf-out || rc=$?
          echo "the build exited $rc (3 = build-source-unavailable, expected offline)"
          test -e /tmp/plf-out/features.tsv \
            || { echo "::error::the build never reached its writer, so this step checked nothing"; exit 1; }
          # At any depth, and case-insensitively: the runner is ext4 but half the
          # contributors are on NTFS, where signoff.tsv IS SIGNOFF.tsv. The old
          # `test ! -e /tmp/plf-out/SIGNOFF.tsv` saw neither a subdirectory nor a
          # rename of case.
          found=$(find /tmp/plf-out -iname 'SIGNOFF.tsv' -print -quit)
          test -z "$found" \
            || { echo "::error::the build emitted $found into its output directory"; exit 1; }
          # `git diff` says NOTHING about a path git is not tracking, so while
          # features/SIGNOFF.tsv is untracked the check below exits 0 whatever
          # the build did to it. That is this step's third vacuity mode, and it
          # is live exactly when the control matters most: the moment the file
          # is added, renamed, or dropped from the index.
          git ls-files --error-unmatch features/SIGNOFF.tsv >/dev/null 2>&1 \
            || { echo "::error::features/SIGNOFF.tsv is not tracked by git, so the diff below would prove nothing"; exit 1; }
          git diff --exit-code -- features/SIGNOFF.tsv \
            || { echo "::error::the build modified features/SIGNOFF.tsv; a sign-off comes from a human, not from a program"; exit 1; }
          rm -rf /tmp/plf-out
          echo "the writer ran and the sign-off table is read-only to it"

      # features/SOURCING.md section 0.4. Fetches pLannotate's snapgene.csv at a
      # pinned immutable commit, asserts its sha256, measures containment
      # against our descriptions, and deletes it. No byte is committed: the
      # filename is in .gitignore and tools/hooks/pre-commit rejects the blob by
      # content hash, so a rename does not defeat it.
      #
      # Fails CLOSED. A network error exits 3 with `taint-gate-unavailable`,
      # because "could not check" and "checked and clean" are different results.
      # This step is the concrete evidence behind the project's central claim
      # that this database is not derived from SnapGene's DESCRIPTIONS, and the
      # NOTICE discloses it -- so it has to exist, and it has to run.
      #
      # DESCRIPTIONS, and that word is doing work. The pinned artifact is four
      # columns -- sseqid, Feature, Type, Description -- with no sequence and no
      # coordinate in it, so the one thing it cannot support is a comparison of
      # feature BOUNDARIES. Boundaries have a route of their own into this
      # database: ENA folds a submitter's SnapGene `/label` into the `/note`, so
      # a depositor who annotated their plasmid in SnapGene publishes SnapGene's
      # boundary convention inside an ordinary INSDC record. features/SOURCING.md
      # section 0.6 sets out why nobody can measure that, rather than promising a
      # check later.
      #
      # So this command runs TWO gates, the structural one FIRST and before any
      # fetch: features/build/insdc_posture.py requires every stage in
      # build.STAGES to declare what it does about a depositor's coordinates,
      # refuses one that declares nothing, and drives the mechanisms those
      # declarations name. Running it first is deliberate -- on a day the pin is
      # unreachable and the fetch below exits 3, the structural half has still
      # run and still said something. It also runs alone, offline, as a step in
      # tools/ci.ps1, which is the first part of this gate's subject to have a
      # local twin at all.
      - name: Taint gate -- stage postures, then our descriptions vs pLannotate's snapgene.csv
        run: python features/build/taint_gate.py

      # The taint gate brought an unlicensed file onto the runner. Prove the
      # working tree is clean of it afterwards, by content and not by name.
      #
      # THE SECOND HALF IS WHAT MAKES THAT SENTENCE TRUE, and it was missing.
      # This step was `git status --porcelain` alone, which reports nothing
      # about an IGNORED path -- and `.gitignore` ignores `snapgene.csv` at any
      # depth, with no leading slash, so it matches in every directory. A
      # payload left in the tree under the file's own name was therefore the
      # one case this step could not see: `git status --porcelain` printed
      # nothing and the step echoed "working tree clean". A step named
      # "Nothing from the taint gate survived", claiming in this comment to
      # check by content, was checking by name and missing the only name that
      # matters. `--ignored` is not the fix on its own: `target/` is present by
      # then and would fail the step on every run.
      #
      # So: half one is the dirty-tree check, unchanged. Half two hashes every
      # file in the tree -- tracked, untracked and ignored alike, since it asks
      # the filesystem and not git -- and compares each against the pinned
      # sha256, which is the same constant `tools/hooks/pre-commit` compares
      # staged blobs against. A rename defeats neither half.
      #
      # `target/` is the one exclusion, and it is a scoped claim rather than a
      # hidden one: it is cargo's output, it is gigabytes, it is written by a
      # build step that ran before the gate, and `features/build/taint_gate.py`
      # cannot put anything there -- it fetches into `tempfile.mkdtemp()`,
      # outside the repository entirely, and removes it in a `finally` before
      # refusing to exit clean if it survived. This sweep is the defence in
      # depth behind that, over the tree a person can leave a file in.
      #
      # The file count is asserted because this file already documents three
      # ways a step here passed while checking nothing. A sweep that enumerated
      # an empty tree would find no match and report success.
      - name: Nothing from the taint gate survived
        run: |
          PINNED=793631d9eebf721efae9e1d6cd483b1cbb62f5adad41174afa8f8b78b1342d5c

          git status --porcelain > /tmp/tree.txt
          if [ -s /tmp/tree.txt ]; then
            echo "::error::the working tree is dirty after the taint gate:"
            cat /tmp/tree.txt
            exit 1
          fi

          find . -path ./.git -prune -o -path ./target -prune -o -type f -print0 \
            | xargs -0 -r sha256sum > /tmp/tree-hashes.txt
          n=$(wc -l < /tmp/tree-hashes.txt)
          if [ "$n" -lt 100 ]; then
            echo "::error::the content sweep hashed only $n file(s); a checkout of this repository has 245 tracked files alone, so it enumerated almost nothing and proved nothing"
            exit 1
          fi
          # Matched as a whole field, not with `grep "^$PINNED  "`. sha256sum
          # separates the digest from the path with two spaces in text mode and
          # with " *" in binary mode, and which one it picks is a property of
          # the platform's coreutils. The two-space form was written first and
          # measured NOT to fire against a planted file, because the sweep had
          # emitted the binary form. A comparison that silently depends on
          # whitespace is how this step got here.
          awk -v p="$PINNED" '$1 == p' /tmp/tree-hashes.txt > /tmp/tainted.txt
          if [ -s /tmp/tainted.txt ]; then
            echo "::error::a file in the working tree has pLannotate's snapgene.csv contents, whatever it has been renamed to:"
            cat /tmp/tainted.txt
            exit 1
          fi
          echo "working tree clean, and none of the $n files in it hashes to the pinned blob"
