name: CI

# Everything in this file has been run by hand at some point. That is exactly
# the problem it exists to fix: a number nobody re-checks is a number that
# quietly stops being true.
#
# Note what is *not* here: the .dna corpus. Those files are not redistributable
# (Addgene's terms are noncommercial-only with an anti-scraping clause, and lab
# files belong to their labs), so the corpus tests skip unless PL_CORPUS points
# somewhere. Everything below runs on synthetic or committed data.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # eframe needs system libraries on Linux; the other two ship theirs.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      # `--locked` on every cargo invocation that resolves, from here down.
      #
      # Committing Cargo.lock is most of the fix, but not all of it: cargo will
      # quietly rewrite the lock whenever it decides it has to, and a CI run that
      # rewrites the lock is back to testing a graph nobody chose. `--locked`
      # turns that into an error instead, so the job either builds exactly the
      # dependency set in the commit or fails saying it could not.
      #
      # It also makes an upstream yank or a Cargo.toml edit that outgrows the
      # lock visible as a CI failure rather than as a silent version bump.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Unit tests
        run: cargo test --workspace --lib --bins --locked

      - name: Build release
        run: cargo build --workspace --release --locked

      # The corpus tests are expected to skip here. Running them anyway proves
      # they skip cleanly rather than failing when PL_CORPUS is unset.
      - name: Corpus tests (skip without a corpus)
        run: cargo test -p pl-fileio --test corpus --locked -- --nocapture

      # `--lib --bins` above excludes every integration suite, and this is the
      # one that independently validates the shipped data: the nt->aa
      # translation of every coding row, and the schema, duplicate and
      # licensed-provenance audit. Both were green locally and absent from CI,
      # and the gap widened five-fold when the table grew from 8 rows to 70.
      # Two of its four tests are PL_CORPUS-gated and skip cleanly here, the
      # same pattern as the step above; the other two read features.tsv
      # directly and do the work.
      - name: Feature database, against the shipped table
        run: cargo test -p pl-features --test corpus --locked -- --nocapture

      # The two schema definitions, in two languages, compared directly. The
      # pin used to work only through the generated header, so a Python-side
      # column rename left the whole suite green until somebody rebuilt.
      - name: The Python builder and the Rust loader agree on the schema
        run: cargo test -p pl-features --test schema_pin --locked -- --nocapture

      # The same gap as the note four steps up, found again and this time on
      # pl-draw. `--lib --bins` excludes these, so `tests/agreement.rs` -- the
      # harness comparing this renderer against the TypeScript one, function by
      # function -- had never run IN CI, on any platform, from the day it was
      # written until this step; `zstream.rs` and `pngfile.rs` would have joined
      # it there.
      #
      # "In CI", precisely, and not the stronger sentence: the local gate does
      # run it -- `tools/ci.ps1`, `Step 'renderers agree (rust replays it)'`,
      # and it was there at 713bd3b too -- so it has been running on one
      # developer's machine, on one OS, and only when `node` is installed, which
      # is the step's precondition. Where the stronger claim is true it is
      # written in full: see the `pl-design` note below, "had never run in CI or
      # in the local gate, on any platform".
      #
      # These three write the artefacts that the Python cross-checks in
      # `tools/ci.ps1` then judge. Running them here does not run those checks;
      # it proves the writers themselves work on all three platforms, which is
      # where a raster is most likely to differ.
      - name: Drawing, compression and PNG integration suites
        run: cargo test -p pl-draw --test agreement --test zstream --test pngfile --test glyphs --test render --locked

      # The same gap a third time, and this one had gone all the way: a grep
      # for `pl-design` over `.github/` and `tools/` returned zero hits, so
      # `crates/pl-design/tests/` -- design, determinism, purity, refusals,
      # scoring, specificity_prefilter, 45 tests -- had never run in CI or in
      # the local gate, on any platform.
      #
      # `purity.rs` is the one that matters most here, because it is the only
      # enforcement left: it reads the crate's own sources and rejects std::fs,
      # std::env, std::process, std::net, the ambient clocks, HashMap/HashSet
      # (RandomState is seeded per process, so a report ordered by a hash
      # iteration differs between runs) and `partial_cmp`. The wasm32 job below
      # is not a backstop for it -- it builds `pl-wasm` and `pl-index`, and
      # `pl-wasm` does not depend on `pl-design`. `determinism.rs` is the other
      # one: nothing else asserts that two runs of one input agree byte for
      # byte, which is the guarantee the whole crate is built around.
      - name: Primer design integration suites
        run: cargo test -p pl-design --tests --locked

      # The compiled-in release public key, and the updater that reads it.
      #
      # No `--tests` filter, unlike the steps above, and it used to have one:
      # when `crates/pl-update` was three constants and no code, every test it
      # had was an integration test. It now has both, so the whole crate is run
      # here. `--lib --bins` above would reach the unit tests and not the four
      # integration suites, which are the ones holding docs/RELEASING.md's
      # requirements 1 and 4.
      #
      # Nothing else in this repository reads `RELEASE_PUBLIC_KEY`, so without
      # this a wrong nibble among its 32 byte literals compiles, links and
      # ships, and is first noticed by a user whose updater refuses a genuine
      # release -- or does not refuse a forged one. And `tests/handoff.rs` is
      # the only thing anywhere that holds the two requirements which are claims
      # about what the crate does NOT do: no thread, no timer, no clock, no
      # program run but `curl`, nothing that copies over or launches what it
      # downloaded. Those cannot be caught by calling anything -- a version that
      # launched the installer would pass every functional test in the crate --
      # so they are checked by reading the sources, here.
      #
      # It also pins the coupling `release.yml` relies on: that workflow greps
      # the key's base64 form out of `crates/pl-update/src/lib.rs`, so that the
      # signature it makes is verified against the key that actually ships
      # rather than against a second copy pasted into YAML. A doc-comment edit
      # adding a second base64 token would break a release that cannot be
      # rehearsed after the tag is pushed; this says so on the pull request.
      - name: The release key, and the updater that reads it
        run: cargo test -p pl-update --locked

  # The oldest toolchain this workspace claims to build on, actually building it.
  #
  # `rust-version` in the root Cargo.toml read 1.82 for as long as the workspace
  # has existed and no job had ever used it: the matrix above is
  # `dtolnay/rust-toolchain@stable`, and stable was 1.97.1 when this was
  # written. That number is not decoration -- `tools/readme/README-LINUX.txt`
  # sends the reader whose glibc is too old for the Linux binaries to build from
  # source and names the toolchain they will need -- so it was advice nobody had
  # tried. It was also wrong: cargo 1.82 refuses `indexmap 2.14.0`'s manifest for
  # being edition 2024, before compiling a line.
  msrv:
    name: rust-version floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version is NOT written in this file. A toolchain pinned here would
      # be a second copy of a number whose first copy is what users read, and
      # two copies of a number is how the first one stopped being true. This
      # installs whatever the manifest declares, and fails if it declares
      # nothing rather than silently falling back to stable -- a floor job
      # running on stable is the exact vacuity it exists to end.
      - name: The floor, read out of Cargo.toml
        id: floor
        run: |
          v=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          [ -n "$v" ] || { echo "::error::the root Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "the declared floor is $v"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      # `check`, and deliberately not `test`. The claim is that this tree
      # COMPILES on the toolchain it tells people to install; whether it also
      # passes 1,757 tests on a toolchain nobody ships on is a different and
      # much more expensive question, and the matrix above already answers the
      # part that matters.
      #
      # `--locked` carries more weight here than in any other step. The floor is
      # set by the dependency graph and not by this workspace's own code -- what
      # rejected 1.91 was eight egui 0.35 crates declaring 1.92 -- so a resolver
      # free to pick different versions would be measuring a different floor
      # from the one that ships.
      #
      # `RUSTFLAGS: -D warnings` from the top of this file applies here too, and
      # that is intended: an old rustc warning about code stable accepts
      # silently is still something a reader following README-LINUX.txt will
      # meet.
      - name: cargo check on the declared floor
        run: cargo check --workspace --locked

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the browser core
        run: cargo build -p pl-wasm --target wasm32-unknown-unknown --profile wasm --locked
      - name: Drive the real module
        run: |
          cargo build -p pl --release --locked
          node crates/pl-wasm/tests/drive_wasm.mjs \
            target/wasm32-unknown-unknown/wasm/pl_wasm.wasm \
            target/release/pl

  oracles:
    name: differential tests and benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The whole point of these jobs: our answers are checked against tools
      # that are not ours.
      - name: Install the oracles
        run: pip install biopython seguid pydna pillow fonttools resvg-py numpy

      - name: Build
        run: cargo build -p pl --release --locked

      - name: SEGUID checksums vs the reference implementation
        run: python reference/python/tests/xcheck_seguid.py target/release/pl

      # `pl-draw` hand-writes DEFLATE, because `crates/` take no dependencies
      # and a PNG needs one. Its own tests round-trip against an `inflate`
      # written from RFC 1951 in this repository, which catches nearly
      # everything and cannot catch the two of them misreading the spec the same
      # way. `zlib` is the reference implementation, by other people, and is
      # what will open these files. Checked one-shot and then a byte at a time,
      # because a stream can decode correctly in one call and still be malformed
      # for an incremental reader -- measured: appending four bytes was accepted
      # by all ten one-shot decodes and rejected by all ten streaming ones.
      - name: zlib streams vs zlib
        run: |
          cargo test -q -p pl-draw --test zstream --locked
          python reference/python/tests/xcheck_deflate.py .

      # Pillow is a different PNG decoder and stands in for every program that
      # will open these figures. Every pixel is compared against the raw RGB
      # buffer written beside the file, never against a re-encode.
      #
      # Measured limit, worth knowing before anyone calls the unit tests
      # redundant with this: corrupting IDAT's CRC left Pillow opening the file
      # with every pixel still matching. Pillow does not verify it. The Rust
      # test `every_chunk_carries_the_right_crc` is the only cover for that.
      - name: PNGs vs Pillow
        run: |
          cargo test -q -p pl-draw --test pngfile --locked
          python reference/python/tests/xcheck_png.py .

      # `font.rs` walks the `glyf` table by hand and nothing in this repository
      # can check that walk -- a test reading `glyf` the way `font.rs` reads it
      # agrees with itself by construction. fontTools is another implementation
      # by other people, and the implied on-curve point is expanded by ITS
      # `BasePen`, not re-derived here, so the rule under test is not a second
      # copy of our own reasoning. It found two real off-by-ones in this reader
      # before it first passed, both invisible in a rendered glyph.
      - name: Glyph outlines vs fontTools
        run: |
          cargo test -q -p pl-draw --test glyphs --locked
          python reference/python/tests/xcheck_glyphs.py .

      # The whole raster against an independent SVG renderer, handed the SVG
      # this crate emits and forced onto the same two font files it fills
      # outlines from. The discriminator is WHERE the pixels differ, not how
      # many: two correct antialiasing implementations disagree along edges and
      # nowhere else, so every grossly differing pixel must sit on a gradient.
      # A wrong arc, a wrong winding, a misplaced glyph or a hole in a stroke
      # all put differing pixels in flat regions instead.
      - name: The raster vs resvg
        run: |
          cargo test -q -p pl-draw --test render --locked
          python reference/python/tests/xcheck_render.py .

      # The taskbar button of a RUNNING window does not come from the .exe's
      # icon resource: winit never reads it, and `ViewportBuilder::with_icon`
      # takes raw RGBA rather than a .ico. So bins/pl-gui/icon/ holds two
      # generated artefacts from one master. This decodes the .ico's 64 px frame
      # with Pillow and compares all 16,384 bytes against the blob the window is
      # handed, then compares every frame against a fresh resvg render of the
      # master. main.rs's two sha256 prove the pair came out of one run of
      # build-icon.py; only this compares a pixel.
      - name: The window icon vs the .ico
        run: python reference/python/tests/xcheck_icon.py .

      - name: Digest fragments and PCR vs pydna
        run: python reference/python/tests/xcheck_clone.py target/release/pl

      - name: GenBank output is readable by Biopython
        run: |
          python - <<'PY'
          import subprocess, tempfile, os
          from Bio import SeqIO
          gb = subprocess.run(
              ["target/release/pl", "convert", "prototype/demo-construct.gb",
               "--to", "genbank", "--stdout"],
              capture_output=True, text=True, check=True).stdout
          with tempfile.NamedTemporaryFile("w", suffix=".gb", delete=False,
                                           encoding="utf-8", newline="\n") as fh:
              fh.write(gb); path = fh.name
          rec = SeqIO.read(path, "genbank")
          os.unlink(path)
          print(f"biopython read it back: {len(rec.seq)} bp, {len(rec.features)} features")
          assert len(rec.seq) == 3180, len(rec.seq)
          PY

      # The benchmark is committed, synthetic and CC0, so it runs anywhere.
      # A regression that drops the score fails the build.
      - name: polylinker-bench
        run: |
          python bench/run.py bench/polylinker-bench.json \
            -- target/release/pl bench-adapter | tee /tmp/bench.txt
          grep -qE "^all +176 +0 +0 +176 +100\.0%" /tmp/bench.txt \
            || { echo "::error::bench score changed — update the expected line if intended"; exit 1; }

      - name: The benchmark regenerates identically
        run: |
          python bench/generate.py > /tmp/regen.json
          diff -q bench/polylinker-bench.json /tmp/regen.json \
            || { echo "::error::generate.py is no longer deterministic"; exit 1; }

      # "AI may propose, never assert", checked against the files on disk by a
      # program that knows nothing about how they were written, and that plants
      # each forbidden edit into the real table first and requires itself to
      # catch it. It was local-only; a rule nobody runs is a rule.
      #
      # The rule did not change when the PI turned curator sign-off on
      # (2026-07-28); the mechanism did. A row may sit above `proposed` only if
      # features/SIGNOFF.tsv names it with a content digest that still matches.
      # This step used to be called "Every feature row is proposed, with no
      # curator", which is a statement about the data rather than about the rule
      # -- and it would have had to be deleted the first time a curator signed
      # anything, which is exactly when it is most needed.
      - name: No feature row asserts more than a human signed
        run: python features/build/check_signoff.py

      # The control that makes the sign-off file mean anything: THE BUILD NEVER
      # WRITES IT. Nothing about the hash prevents a machine writing a
      # valid-looking signature, because the digest is computed from the content
      # and authenticates nobody -- its job is stale-approval detection. What
      # stops a machine signing a row is that the only program that could is not
      # allowed to touch the file, and this proves it rather than asserting it.
      # That is the distinction Db::audit's own comment draws about the NO_GO
      # list: discipline is not a control.
      #
      # The build is run into a scratch directory, so the committed tables are
      # not touched either. It may well exit non-zero here — `features/build/
      # .cache/` is gitignored, so on a clean runner every stage re-fetches and
      # some may fail — and that is fine, because `write_outputs` runs
      # regardless and it is the WRITER being audited. The existence of
      # `features.tsv` in the scratch directory is what proves the writer ran;
      # without that check this step would pass vacuously whenever the build
      # died early, which is a check that cannot fail.
      - name: The build reads SIGNOFF.tsv and never writes it
        run: |
          PLF_BUILD_DATE=1970-01-01 python features/build/build.py --out /tmp/plf-out || true
          test -e /tmp/plf-out/features.tsv \
            || { echo "::error::the build never reached its writer, so this step checked nothing"; exit 1; }
          test ! -e /tmp/plf-out/SIGNOFF.tsv \
            || { echo "::error::the build emitted a SIGNOFF.tsv into its output directory"; exit 1; }
          # `git diff` says NOTHING about a path git is not tracking, so while
          # features/SIGNOFF.tsv is untracked the check below exits 0 whatever
          # the build did to it. That is this step's third vacuity mode, and it
          # is live exactly when the control matters most: the moment the file
          # is added, renamed, or dropped from the index.
          git ls-files --error-unmatch features/SIGNOFF.tsv >/dev/null 2>&1 \
            || { echo "::error::features/SIGNOFF.tsv is not tracked by git, so the diff below would prove nothing"; exit 1; }
          git diff --exit-code -- features/SIGNOFF.tsv \
            || { echo "::error::the build modified features/SIGNOFF.tsv; a sign-off comes from a human, not from a program"; exit 1; }
          rm -rf /tmp/plf-out
          echo "the writer ran and the sign-off table is read-only to it"

      # features/SOURCING.md section 0.4. Fetches pLannotate's snapgene.csv at a
      # pinned immutable commit, asserts its sha256, measures containment
      # against our descriptions, and deletes it. No byte is committed: the
      # filename is in .gitignore and tools/hooks/pre-commit rejects the blob by
      # content hash, so a rename does not defeat it.
      #
      # Fails CLOSED. A network error exits 3 with `taint-gate-unavailable`,
      # because "could not check" and "checked and clean" are different results.
      # This step is the concrete evidence behind the project's central claim
      # that this database is not derived from SnapGene's list, and the NOTICE
      # discloses it -- so it has to exist, and it has to run.
      - name: Taint gate -- our descriptions vs pLannotate's snapgene.csv
        run: python features/build/taint_gate.py

      # The taint gate brought an unlicensed file onto the runner. Prove the
      # working tree is clean of it afterwards, by content and not by name.
      #
      # THE SECOND HALF IS WHAT MAKES THAT SENTENCE TRUE, and it was missing.
      # This step was `git status --porcelain` alone, which reports nothing
      # about an IGNORED path -- and `.gitignore` ignores `snapgene.csv` at any
      # depth, with no leading slash, so it matches in every directory. A
      # payload left in the tree under the file's own name was therefore the
      # one case this step could not see: `git status --porcelain` printed
      # nothing and the step echoed "working tree clean". A step named
      # "Nothing from the taint gate survived", claiming in this comment to
      # check by content, was checking by name and missing the only name that
      # matters. `--ignored` is not the fix on its own: `target/` is present by
      # then and would fail the step on every run.
      #
      # So: half one is the dirty-tree check, unchanged. Half two hashes every
      # file in the tree -- tracked, untracked and ignored alike, since it asks
      # the filesystem and not git -- and compares each against the pinned
      # sha256, which is the same constant `tools/hooks/pre-commit` compares
      # staged blobs against. A rename defeats neither half.
      #
      # `target/` is the one exclusion, and it is a scoped claim rather than a
      # hidden one: it is cargo's output, it is gigabytes, it is written by a
      # build step that ran before the gate, and `features/build/taint_gate.py`
      # cannot put anything there -- it fetches into `tempfile.mkdtemp()`,
      # outside the repository entirely, and removes it in a `finally` before
      # refusing to exit clean if it survived. This sweep is the defence in
      # depth behind that, over the tree a person can leave a file in.
      #
      # The file count is asserted because this file already documents three
      # ways a step here passed while checking nothing. A sweep that enumerated
      # an empty tree would find no match and report success.
      - name: Nothing from the taint gate survived
        run: |
          PINNED=793631d9eebf721efae9e1d6cd483b1cbb62f5adad41174afa8f8b78b1342d5c

          git status --porcelain > /tmp/tree.txt
          if [ -s /tmp/tree.txt ]; then
            echo "::error::the working tree is dirty after the taint gate:"
            cat /tmp/tree.txt
            exit 1
          fi

          find . -path ./.git -prune -o -path ./target -prune -o -type f -print0 \
            | xargs -0 -r sha256sum > /tmp/tree-hashes.txt
          n=$(wc -l < /tmp/tree-hashes.txt)
          if [ "$n" -lt 100 ]; then
            echo "::error::the content sweep hashed only $n file(s); a checkout of this repository has 245 tracked files alone, so it enumerated almost nothing and proved nothing"
            exit 1
          fi
          # Matched as a whole field, not with `grep "^$PINNED  "`. sha256sum
          # separates the digest from the path with two spaces in text mode and
          # with " *" in binary mode, and which one it picks is a property of
          # the platform's coreutils. The two-space form was written first and
          # measured NOT to fire against a planted file, because the sweep had
          # emitted the binary form. A comparison that silently depends on
          # whitespace is how this step got here.
          awk -v p="$PINNED" '$1 == p' /tmp/tree-hashes.txt > /tmp/tainted.txt
          if [ -s /tmp/tainted.txt ]; then
            echo "::error::a file in the working tree has pLannotate's snapgene.csv contents, whatever it has been renamed to:"
            cat /tmp/tainted.txt
            exit 1
          fi
          echo "working tree clean, and none of the $n files in it hashes to the pinned blob"
