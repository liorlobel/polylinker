name: CI

# Everything in this file has been run by hand at some point. That is exactly
# the problem it exists to fix: a number nobody re-checks is a number that
# quietly stops being true.
#
# Note what is *not* here: the .dna corpus. Those files are not redistributable
# (Addgene's terms are noncommercial-only with an anti-scraping clause, and lab
# files belong to their labs), so the corpus tests skip unless PL_CORPUS points
# somewhere. Everything below runs on synthetic or committed data.
#
# ---------------------------------------------------------------------------
# HOW THE TWO GATE FILES DIVIDE THE WORK, since 2026-08-09.
#
# `tools/ci.ps1` is 70 steps and `docs/RELEASING.md` names it as the thing to
# run before tagging. Until today NO WORKFLOW INVOKED IT. It appeared in this
# file six times and every one of them was on a comment line. It had been
# failing on a clean tree since v0.1.2 and six releases were tagged with it red,
# because the only machine running it was the author's and the only evidence
# either way was a terminal nobody was looking at.
#
# So the `gate` job below runs it, on windows-latest, with everything a runner
# can be given installed first. The division that leaves is not "duplicate
# everything" and not "delete the second list" — it is this:
#
#   * `gate` (windows-latest) is the authority. It is the list `RELEASING.md`
#     names, run whole, with its skips asserted against a committed list.
#   * `test` runs on ubuntu-latest and macos-latest ONLY. Those are the two
#     platforms `tools/ci.ps1` cannot run on at all — it hardcodes
#     `target/release/pl.exe` at twenty-one call sites, reads PE resource
#     directories, drives `msiexec` and `HKCU`, and uses `$env:TEMP`, which is
#     absent rather than empty off Windows. Its windows-latest leg WAS deleted,
#     because every step in it is run by `gate` on the same runner image, and
#     that is duplication in the strict sense rather than platform coverage.
#   * `msrv`, `wasm` and `oracles` stay. Each holds something the gate does not:
#     the toolchain floor, the wasm module driven against a Linux `pl`, and four
#     checks with no twin in the gate at all — the taint gate, the content sweep
#     behind it, the offline end-to-end features build, and the GenBank
#     round-trip through Biopython. The rest of `oracles` is a second run of the
#     differential checks on a different OS and a different rendering stack,
#     which for a rasteriser is coverage and not repetition.
#
# WHAT DELETING THE WINDOWS LEG COST, stated rather than glossed: those steps
# passed `--locked` and the gate does not. Lock drift is a property of the tree
# and not of the operating system, and `test` on both remaining runners plus
# `msrv` and `wasm` still pass `--locked` on every cargo invocation, so a
# rewritten lockfile is still a red build on every push. `pl-draw/tests/
# memory.rs` and `pl-features/tests/schema_pin.rs` are run by `test` and by no
# step in the gate; both are arithmetic and file comparison with no OS in them,
# and both still run on two platforms.
#
# `tools/ci.ps1` step 'every integration suite is run by a gate' is what keeps
# that division honest: it reads the tree, and every `tests/*.rs` target under
# `crates/` and `bins/` must be run, unfiltered, by one of these two files.
#
# THE NETWORK, decided rather than inherited. The `gate` job needs it only to
# provision -- cargo's registry, pip, npm, the WiX tool -- and those are steps of
# their own, before the gate, where an outage is a red install step and not a
# silent SKIP. The gate itself fetches from no third-party data source, so there
# is nothing in it to make non-fatal: the live-source build left this file on
# 2026-08-07 for `features-live.yml`, after EBI timed out twice and turned main
# red over commits that had nothing to do with it. The one job here that still
# reaches a service nobody here operates is `oracles`, at its taint-gate step,
# and that stays exactly as it is -- it fails CLOSED, on purpose, because
# "could not check" and "checked and clean" are different results and that step
# is the concrete evidence behind this project's central licensing claim. An
# outage there is a false red on a rare day; making it non-fatal would be a
# permanent false green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # THE GATE. `tools/ci.ps1`, whole, with its skip list checked.
  #
  # windows-latest and not a matrix, because the script is a Windows script.
  # It hardcodes `target/release/pl.exe` at twenty-one call sites and
  # `target/release/examples/dump_spline.exe` at one; it reads PE resource
  # directories out of the built binaries; it installs and uninstalls an MSI
  # with `msiexec` and then reads `HKCU`; and it passes `$env:TEMP` to
  # `Join-Path`, which off Windows is a null argument and a terminating error --
  # the exact failure that killed both non-Windows legs of the first release.
  # Making it portable is real work and is not this change. What this change
  # fixes is that it ran nowhere, and a matrix here would be a fresh claim that
  # nobody had run.
  #
  # 70 steps, of which 65 must run here. See `.github/ci-expected-skips.txt`.
  gate:
    name: the gate (tools/ci.ps1)
    runs-on: windows-latest
    # The gate builds the workspace in release, builds it again for a dozen
    # integration targets, renders rasters, and installs an MSI twice. Four
    # minutes on a warm developer machine with everything already compiled is
    # not the number to size a cold runner on.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # Four gate steps are preconditioned on `rustup target list
          # --installed` containing this, and three of them are not on the
          # expected-skip list: the wasm32 build, the wasm self-checks and the
          # pl-index purity build. No runner image ships the target, so without
          # this line all three SKIP and the job goes red saying so. (The
          # fourth, the wasm-versus-native comparison, needs a corpus and is on
          # the list.)
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # THE PROVISIONING BELOW IS THE POINT OF THE JOB, not scaffolding for it.
      #
      # A gate job on a stock runner would print GATE PASSED having skipped
      # every step that needs Python, node, the wasm target, WiX or a `dist/`,
      # which is over half of them -- a more convincing version of the failure
      # being fixed, because it comes with a green check. Every install here
      # turns steps from SKIP into ok, and `-ExpectedSkips` at the end is what
      # stops that quietly going backwards.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The `oracles` job installs the first seven. The last four are what makes
      # three gate steps possible at all -- scipy for the gel calibration spline
      # against SciPy, pymupdf and pypdf for 'PDF is a PDF, and matches the
      # SVG', PyYAML for 'the release workflow parses and covers three
      # platforms'. Those three steps are gate-only and the gate ran nowhere, so
      # until now they had never executed in CI on any platform.
      #
      # All eleven have Windows wheels; verified on the author's machine, where
      # every one of them imports and no step gated on them skipped.
      - name: Install the oracles
        run: pip install biopython seguid pydna pillow fonttools resvg-py numpy scipy pymupdf pypdf PyYAML

      # `node --test --experimental-strip-types test/*.test.ts` needs Node 22.6
      # or newer, and `Have node` is true on any of them -- so on an image with
      # Node 20 the two TypeScript steps would FAIL rather than skip. Pinned to
      # the major the fixture was generated with, because 'renderers agree
      # (fixture is current)' regenerates `crates/pl-draw/tests/agreement.json`
      # and compares it to the committed bytes.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `packages/circular-map/node_modules` is gitignored, so it is absent on
      # every fresh checkout and the `typecheck` step is preconditioned on it
      # existing. `npm ci` installs from the committed lockfile; the only
      # dependency is TypeScript itself.
      - name: Install the TypeScript toolchain
        working-directory: packages/circular-map
        run: npm ci

      # Same version and same extension as release.yml installs, deliberately:
      # the gate step builds an MSI with `tools/build-msi.ps1` and the release
      # builds it with the same script, and an installer that changes shape
      # between the two would make the gate's answer worthless.
      - name: Install the WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'installing wix failed' }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'adding the WiX UI extension failed' }
          wix --version

      # dist/, because two gate steps are preconditioned on
      # `dist/SHA256SUMS.txt` existing: the one proving the MSI is generated
      # from the manifest rather than from a second file list, and the one that
      # actually installs it. On a developer machine that directory is there
      # because they have cut a release into it at some point. On a runner
      # nothing creates it, so both steps would skip -- which is how the MSI
      # install test came to be one of the six skipped for six releases.
      #
      # This is `tools/release.ps1` with its default `-Out dist`, which is the
      # same invocation release.yml uses, so nothing here is a CI-only path.
      # `/dist/` is gitignored, so the working tree stays clean underneath it.
      - name: Assemble dist/, which the two MSI steps read
        shell: pwsh
        run: |
          ./tools/release.ps1 -Out dist -Quiet
          if (-not (Test-Path dist/SHA256SUMS.txt)) {
            Write-Host '::error::release.ps1 produced no dist/SHA256SUMS.txt, so the two MSI steps would silently skip'
            exit 1
          }

      # THE EXIT-CODE PATH, PROVED BEFORE IT IS RELIED ON.
      #
      # The whole job rests on a red gate turning into a red build, and
      # PowerShell exit codes through a `run:` step are a genuine trap: a cmdlet
      # does not set $LASTEXITCODE at all, so a failure that arrives as a thrown
      # object rather than as a process exit can leave the variable holding the
      # 0 from whatever ran before. `tools/ci.ps1` documents four distinct ways
      # that bit it INSIDE its own step bodies -- three in the comment on `Step`
      # and a fourth on `CargoTest` -- and every one was found by audit rather
      # than by a red gate. Assuming the same mechanism is sound one level
      # further out, in the shell that invokes the script, would be the same
      # assumption that let this file reference the gate in six comments and run
      # it in none.
      #
      # Two halves, because they are two different mechanisms and one probe
      # cannot fail for both:
      #
      #   1. `pwsh -NoProfile -File <script>` reports the script's own `exit N`
      #      as $LASTEXITCODE in the caller. Checked here, and a fail is a fail.
      #   2. A `run:` step that exits non-zero is recorded as a failed step.
      #      Checked below with a step that deliberately exits 7 under
      #      `continue-on-error`, and a following step that fails the job unless
      #      that step's outcome was `failure`.
      - name: A script's exit code survives `pwsh -File`  (control 1 of 2)
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'exit-probe.ps1'
          Set-Content -LiteralPath $probe -Value 'exit 7'
          pwsh -NoProfile -File $probe
          if ($LASTEXITCODE -ne 7) {
            Write-Host "::error::a script that exited 7 came back as $LASTEXITCODE; the gate's failures would not reach this job"
            exit 1
          }
          Write-Host 'a script exiting 7 arrives as 7'

      - name: A step that exits non-zero is a failed step  (control 2 of 2)
        id: nonzero-exit
        continue-on-error: true
        shell: pwsh
        run: exit 7

      - name: ...and this job noticed it  (control 2 of 2, checked)
        shell: pwsh
        run: |
          $outcome = '${{ steps.nonzero-exit.outcome }}'
          if ($outcome -ne 'failure') {
            Write-Host "::error::a pwsh step that exited 7 was recorded as '$outcome'; a red gate would not turn this build red"
            exit 1
          }
          Write-Host 'a step exiting 7 was recorded as a failure'

      # THE GATE, and the assertion that it ran.
      #
      # -ExpectedSkips makes the skip list a checked claim instead of grey text
      # nobody reads: the run fails if a step skipped that is not on the list,
      # if a step on the list did not skip, or if the list names a step this
      # gate no longer has. Set equality, not a count -- a count of five is
      # satisfied by the wrong five skipping.
      #
      # `exit $LASTEXITCODE` explicitly. GitHub appends its own
      # `if (Test-Path variable:\LASTEXITCODE) { exit $LASTEXITCODE }` to a pwsh
      # step, which would do the same thing here, but only for as long as the
      # last statement in this block stays a native call. Saying it is one line
      # and removes the dependency on nobody ever adding a `Write-Host` below.
      - name: The gate
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/ci.ps1 -ExpectedSkips "$env:GITHUB_WORKSPACE/.github/ci-expected-skips.txt"
          exit $LASTEXITCODE

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is deliberately absent: the `gate` job above runs every
        # one of the steps below, on the same runner image, as part of the list
        # `docs/RELEASING.md` names. See the division set out in this file's
        # header, including what dropping it cost.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # eframe needs system libraries on Linux; macOS ships its own. The `if`
      # stays rather than becoming unconditional: this matrix has had three
      # entries and now has two, and a step that says which platform it is for
      # survives the next edit to that list.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      # `--locked` on every cargo invocation that resolves, from here down.
      #
      # Committing Cargo.lock is most of the fix, but not all of it: cargo will
      # quietly rewrite the lock whenever it decides it has to, and a CI run that
      # rewrites the lock is back to testing a graph nobody chose. `--locked`
      # turns that into an error instead, so the job either builds exactly the
      # dependency set in the commit or fails saying it could not.
      #
      # It also makes an upstream yank or a Cargo.toml edit that outgrows the
      # lock visible as a CI failure rather than as a silent version bump.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Unit tests
        run: cargo test --workspace --lib --bins --locked

      - name: Build release
        run: cargo build --workspace --release --locked

      # ALL of pl-fileio's integration targets, not just `corpus`.
      #
      # This named `--test corpus` alone, and `tests/notes_report.rs` was
      # therefore run by nothing -- not here, and not in tools/ci.ps1, whose
      # pl-fileio step was corpus-gated and skipped on any machine without the
      # lab drive. Its four tests are the only cover for lib.rs:221, the line
      # that carries the unrepresentable-notes report from `Document` to
      # `LoadReport`; the file's own header records that replacing it with
      # `Vec::new()` left `cargo test --workspace` green, and `pl info` and
      # `pl convert` would then silently stop telling the user which part of a
      # .dna's Notes block was dropped.
      #
      # `--tests` rather than a second `--test` name, so the next file added
      # under tests/ is run the day it is written. The corpus tests still skip
      # cleanly with PL_CORPUS unset, which running them here still proves.
      - name: File I/O integration suites (corpus cases skip without a corpus)
        run: cargo test -p pl-fileio --tests --locked -- --nocapture

      # `--lib --bins` above excludes every integration suite, and this is the
      # one that independently validates the shipped data: the nt->aa
      # translation of every coding row, and the schema, duplicate and
      # licensed-provenance audit. Both were green locally and absent from CI,
      # and the gap widened five-fold when the table grew from 8 rows to 70.
      # Two of its five tests are PL_CORPUS-gated and skip cleanly here, the
      # same pattern as the step above; the other three read features.tsv
      # directly and do the work.
      #
      # No name filter, here or in tools/ci.ps1. The local gate used to run this
      # target twice with one filter each, and one of those filters named a test
      # that had been renamed, so it selected nothing and printed ok --
      # `cargo test` exits 0 when a filter matches nothing.
      - name: Feature database, against the shipped table
        run: cargo test -p pl-features --test corpus --locked -- --nocapture

      # The two schema definitions, in two languages, compared directly. The
      # pin used to work only through the generated header, so a Python-side
      # column rename left the whole suite green until somebody rebuilt.
      - name: The Python builder and the Rust loader agree on the schema
        run: cargo test -p pl-features --test schema_pin --locked -- --nocapture

      # The same gap as the note four steps up, found again and this time on
      # pl-draw. `--lib --bins` excludes these, so `tests/agreement.rs` -- the
      # harness comparing this renderer against the TypeScript one, function by
      # function -- had never run IN CI, on any platform, from the day it was
      # written until this step; `zstream.rs` and `pngfile.rs` would have joined
      # it there.
      #
      # "In CI", precisely, and not the stronger sentence: the gate does run it
      # -- `tools/ci.ps1`, `Step 'renderers agree (rust replays it)'`, and it
      # was there at 713bd3b too -- so until 2026-08-09 it had been running on
      # one developer's machine, on one OS, and only when `node` is installed,
      # which is the step's precondition. It now runs in the `gate` job as well,
      # where `node` is installed on purpose and a skip is a failure. Where the
      # stronger claim is true it is written in full: see the `pl-design` note
      # below, "had never run in CI or in the local gate, on any platform".
      #
      # These write the artefacts that the Python cross-checks in `tools/ci.ps1`
      # then judge. Running them here does not run those checks; it proves the
      # writers themselves work on the two platforms this job covers, which
      # together with the `gate` job on windows-latest is all three -- and a
      # raster is where they are most likely to differ.
      #
      # `memory` is the exception and the only one: no step in the gate names
      # it, so of these six suites it is the one that runs on two platforms
      # rather than three. It counts `Layout` sizes -- what the program asked
      # the allocator for, not what any allocator returned -- so there is no
      # operating system in the number it measures.
      #
      # `memory` was missing from this list and named nowhere else either: a
      # grep for it over .github/ and tools/ returned nothing, so the one test
      # that measures what a PNG export really asks the allocator for was run by
      # no gate. What it holds is `PNG_BYTES_PER_PIXEL` (lib.rs:1566), which
      # every other mention of is prose: deflate.rs's per-input-byte arithmetic,
      # and the refusal `MAX_PIXELS` hands the user, which multiplies by it to
      # say the export "would need about N GB of memory" (lib.rs:1624, 1633).
      # A counting allocator across a real png_at is the only thing that
      # measures it.
      #
      # Every other pl-draw suite is named on this line, which is exactly how
      # one of them goes unnoticed. tools/ci.ps1 now carries a step that refuses
      # the next such omission by reading the tree instead of a list.
      - name: Drawing, compression and PNG integration suites
        run: cargo test -p pl-draw --test agreement --test zstream --test pngfile --test glyphs --test render --test memory --locked

      # The same gap a third time, and this one had gone all the way: a grep
      # for `pl-design` over `.github/` and `tools/` returned zero hits, so
      # `crates/pl-design/tests/` -- design, determinism, purity, refusals,
      # scoring, specificity_prefilter, 45 tests -- had never run in CI or in
      # the local gate, on any platform.
      #
      # `purity.rs` is the one that matters most here, because it is the only
      # enforcement left: it reads the crate's own sources and rejects std::fs,
      # std::env, std::process, std::net, the ambient clocks, HashMap/HashSet
      # (RandomState is seeded per process, so a report ordered by a hash
      # iteration differs between runs) and `partial_cmp`. The wasm32 job below
      # is not a backstop for it -- it builds `pl-wasm` and `pl-index`, and
      # `pl-wasm` does not depend on `pl-design`. `determinism.rs` is the other
      # one: nothing else asserts that two runs of one input agree byte for
      # byte, which is the guarantee the whole crate is built around.
      - name: Primer design integration suites
        run: cargo test -p pl-design --tests --locked

      # The compiled-in release public key, and the updater that reads it.
      #
      # No `--tests` filter, unlike the steps above, and it used to have one:
      # when `crates/pl-update` was three constants and no code, every test it
      # had was an integration test. It now has both, so the whole crate is run
      # here. `--lib --bins` above would reach the unit tests and not the four
      # integration suites, which are the ones holding docs/RELEASING.md's
      # requirements 1 and 4.
      #
      # Nothing else in this repository reads `RELEASE_PUBLIC_KEY`, so without
      # this a wrong nibble among its 32 byte literals compiles, links and
      # ships, and is first noticed by a user whose updater refuses a genuine
      # release -- or does not refuse a forged one. And `tests/handoff.rs` is
      # the only thing anywhere that holds the two requirements which are claims
      # about what the crate does NOT do: no thread, no timer, no clock, no
      # program run but `curl`, nothing that copies over or launches what it
      # downloaded. Those cannot be caught by calling anything -- a version that
      # launched the installer would pass every functional test in the crate --
      # so they are checked by reading the sources, here.
      #
      # It also pins the coupling `release.yml` relies on: that workflow greps
      # the key's base64 form out of `crates/pl-update/src/lib.rs`, so that the
      # signature it makes is verified against the key that actually ships
      # rather than against a second copy pasted into YAML. A doc-comment edit
      # adding a second base64 token would break a release that cannot be
      # rehearsed after the tag is pushed; this says so on the pull request.
      - name: The release key, and the updater that reads it
        run: cargo test -p pl-update --locked

      # The binary, from the outside. `bins/pl/tests/cli.rs`, all 53 tests.
      #
      # This workflow never tested package `pl` at all -- it only built it --
      # and the single line in tools/ci.ps1 that reached the target passed a
      # name filter selecting one test. So 52 ran on no machine in any gate.
      #
      # What that left unenforced is not hypothetical. `bins/pl/Cargo.toml`
      # names `only_the_update_verb_can_reach_the_network` (cli.rs:2383) as the
      # mechanism holding the project's promise that exactly one verb touches
      # the network: it reads the binary's own source and fails if a call into
      # `pl_update` appears outside `cmd_update`. Nothing else holds it --
      # pl-update's `handoff.rs` reads only its own crate. Adding
      # `let _ = pl_update::curl_available();` to `cmd_info` compiles, passes
      # clippy, builds a release, and was green in both gates. The same file is
      # the regression suite for the previous audit's data-loss findings, each
      # of which shipped once.
      #
      # Cheap and portable: no corpus, no Python, no node, 13s locally, and the
      # tests write only under `std::env::temp_dir()`.
      - name: The pl binary, from the outside
        run: cargo test -p pl --test cli --locked

  # The oldest toolchain this workspace claims to build on, actually building it.
  #
  # `rust-version` in the root Cargo.toml read 1.82 for as long as the workspace
  # has existed and no job had ever used it: the matrix above is
  # `dtolnay/rust-toolchain@stable`, and stable was 1.97.1 when this was
  # written. That number is not decoration -- `tools/readme/README-LINUX.txt`
  # sends the reader whose glibc is too old for the Linux binaries to build from
  # source and names the toolchain they will need -- so it was advice nobody had
  # tried. It was also wrong: cargo 1.82 refuses `indexmap 2.14.0`'s manifest for
  # being edition 2024, before compiling a line.
  msrv:
    name: rust-version floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version is NOT written in this file. A toolchain pinned here would
      # be a second copy of a number whose first copy is what users read, and
      # two copies of a number is how the first one stopped being true. This
      # installs whatever the manifest declares, and fails if it declares
      # nothing rather than silently falling back to stable -- a floor job
      # running on stable is the exact vacuity it exists to end.
      - name: The floor, read out of Cargo.toml
        id: floor
        run: |
          v=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          [ -n "$v" ] || { echo "::error::the root Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "the declared floor is $v"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      # `check`, and deliberately not `test`. The claim is that this tree
      # COMPILES on the toolchain it tells people to install; whether it also
      # passes 1,757 tests on a toolchain nobody ships on is a different and
      # much more expensive question, and the matrix above already answers the
      # part that matters.
      #
      # `--locked` carries more weight here than in any other step. The floor is
      # set by the dependency graph and not by this workspace's own code -- what
      # rejected 1.91 was eight egui 0.35 crates declaring 1.92 -- so a resolver
      # free to pick different versions would be measuring a different floor
      # from the one that ships.
      #
      # `RUSTFLAGS: -D warnings` from the top of this file applies here too, and
      # that is intended: an old rustc warning about code stable accepts
      # silently is still something a reader following README-LINUX.txt will
      # meet.
      - name: cargo check on the declared floor
        run: cargo check --workspace --locked

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the browser core
        run: cargo build -p pl-wasm --target wasm32-unknown-unknown --profile wasm --locked
      - name: Drive the real module
        run: |
          cargo build -p pl --release --locked
          node crates/pl-wasm/tests/drive_wasm.mjs \
            target/wasm32-unknown-unknown/wasm/pl_wasm.wasm \
            target/release/pl

  oracles:
    name: differential tests and benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The whole point of these jobs: our answers are checked against tools
      # that are not ours.
      - name: Install the oracles
        run: pip install biopython seguid pydna pillow fonttools resvg-py numpy

      - name: Build
        run: cargo build -p pl --release --locked

      - name: SEGUID checksums vs the reference implementation
        run: python reference/python/tests/xcheck_seguid.py target/release/pl

      # `pl-draw` hand-writes DEFLATE, because `crates/` take no dependencies
      # and a PNG needs one. Its own tests round-trip against an `inflate`
      # written from RFC 1951 in this repository, which catches nearly
      # everything and cannot catch the two of them misreading the spec the same
      # way. `zlib` is the reference implementation, by other people, and is
      # what will open these files. Checked one-shot and then a byte at a time,
      # because a stream can decode correctly in one call and still be malformed
      # for an incremental reader -- measured: appending four bytes was accepted
      # by all ten one-shot decodes and rejected by all ten streaming ones.
      - name: zlib streams vs zlib
        run: |
          cargo test -q -p pl-draw --test zstream --locked
          python reference/python/tests/xcheck_deflate.py .

      # Pillow is a different PNG decoder and stands in for every program that
      # will open these figures. Every pixel is compared against the raw RGB
      # buffer written beside the file, never against a re-encode.
      #
      # Measured limit, worth knowing before anyone calls the unit tests
      # redundant with this: corrupting IDAT's CRC left Pillow opening the file
      # with every pixel still matching. Pillow does not verify it. The Rust
      # test `every_chunk_carries_the_right_crc` is the only cover for that.
      - name: PNGs vs Pillow
        run: |
          cargo test -q -p pl-draw --test pngfile --locked
          python reference/python/tests/xcheck_png.py .

      # `font.rs` walks the `glyf` table by hand and nothing in this repository
      # can check that walk -- a test reading `glyf` the way `font.rs` reads it
      # agrees with itself by construction. fontTools is another implementation
      # by other people, and the implied on-curve point is expanded by ITS
      # `BasePen`, not re-derived here, so the rule under test is not a second
      # copy of our own reasoning. It found two real off-by-ones in this reader
      # before it first passed, both invisible in a rendered glyph.
      - name: Glyph outlines vs fontTools
        run: |
          cargo test -q -p pl-draw --test glyphs --locked
          python reference/python/tests/xcheck_glyphs.py .

      # The whole raster against an independent SVG renderer, handed the SVG
      # this crate emits and forced onto the same two font files it fills
      # outlines from. The discriminator is WHERE the pixels differ, not how
      # many: two correct antialiasing implementations disagree along edges and
      # nowhere else, so every grossly differing pixel must sit on a gradient.
      # A wrong arc, a wrong winding, a misplaced glyph or a hole in a stroke
      # all put differing pixels in flat regions instead.
      - name: The raster vs resvg
        run: |
          cargo test -q -p pl-draw --test render --locked
          python reference/python/tests/xcheck_render.py .

      # The taskbar button of a RUNNING window does not come from the .exe's
      # icon resource: winit never reads it, and `ViewportBuilder::with_icon`
      # takes raw RGBA rather than a .ico. So bins/pl-gui/icon/ holds two
      # generated artefacts from one master. This decodes the .ico's 64 px frame
      # with Pillow and compares all 16,384 bytes against the blob the window is
      # handed, then compares every frame against a fresh resvg render of the
      # master. main.rs's two sha256 prove the pair came out of one run of
      # build-icon.py; only this compares a pixel.
      - name: The window icon vs the .ico
        run: python reference/python/tests/xcheck_icon.py .

      - name: Digest fragments and PCR vs pydna
        run: python reference/python/tests/xcheck_clone.py target/release/pl

      - name: GenBank output is readable by Biopython
        run: |
          python - <<'PY'
          import subprocess, tempfile, os
          from Bio import SeqIO
          gb = subprocess.run(
              ["target/release/pl", "convert", "prototype/demo-construct.gb",
               "--to", "genbank", "--stdout"],
              capture_output=True, text=True, check=True).stdout
          with tempfile.NamedTemporaryFile("w", suffix=".gb", delete=False,
                                           encoding="utf-8", newline="\n") as fh:
              fh.write(gb); path = fh.name
          rec = SeqIO.read(path, "genbank")
          os.unlink(path)
          print(f"biopython read it back: {len(rec.seq)} bp, {len(rec.features)} features")
          assert len(rec.seq) == 3180, len(rec.seq)
          PY

      # The benchmark is committed, synthetic and CC0, so it runs anywhere.
      # A regression that drops the score fails the build.
      - name: polylinker-bench
        run: |
          python bench/run.py bench/polylinker-bench.json \
            -- target/release/pl bench-adapter | tee /tmp/bench.txt
          grep -qE "^all +176 +0 +0 +176 +100\.0%" /tmp/bench.txt \
            || { echo "::error::bench score changed — update the expected line if intended"; exit 1; }

      - name: The benchmark regenerates identically
        run: |
          python bench/generate.py > /tmp/regen.json
          diff -q bench/polylinker-bench.json /tmp/regen.json \
            || { echo "::error::generate.py is no longer deterministic"; exit 1; }

      # "AI may propose, never assert", checked against the files on disk by a
      # program that knows nothing about how they were written, and that plants
      # each forbidden edit into the real table first and requires itself to
      # catch it. It was local-only; a rule nobody runs is a rule.
      #
      # The rule did not change when the PI turned curator sign-off on
      # (2026-07-28); the mechanism did. A row may sit above `proposed` only if
      # features/SIGNOFF.tsv names it with a content digest that still matches.
      # This step used to be called "Every feature row is proposed, with no
      # curator", which is a statement about the data rather than about the rule
      # -- and it would have had to be deleted the first time a curator signed
      # anything, which is exactly when it is most needed.
      - name: No feature row asserts more than a human signed
        run: python features/build/check_signoff.py

      # The control that makes the sign-off file mean anything: THE BUILD NEVER
      # WRITES IT. Nothing about the hash prevents a machine writing a
      # valid-looking signature, because the digest is computed from the content
      # and authenticates nobody -- its job is stale-approval detection. What
      # stops a machine signing a row is that the only program that could is not
      # allowed to touch the file, and this proves it rather than asserting it.
      # That is the distinction Db::audit's own comment draws about the NO_GO
      # list: discipline is not a control.
      #
      # THIS STEP USED TO NEED THE NETWORK, AND THAT WAS A DEFECT IN THE GATE
      # RATHER THAN A COST OF IT. It ran the real build against live EBI, NCBI,
      # UniProt and RCSB. On 2026-08-07 EBI timed out twice in a row -- first on
      # AAB47270.1, then on AAB59737.1 -- and both times the build died inside a
      # stage, never reached `write_outputs`, and tripped this step's own
      # vacuity guard. The guard was right to fire: nothing had been checked. But
      # main went red twice for a reason no commit under test had anything to do
      # with, which is the worst thing a gate can do, because a red that means
      # nothing teaches people that red means nothing.
      #
      # The property is unchanged and is now checked TWICE, both times offline:
      #
      #   1. `check_writer.py` runs the real `write_outputs` over the real 89
      #      shipped rows with the real signatures applied, and proves it emits
      #      no SIGNOFF.tsv at any depth, leaves features/SIGNOFF.tsv
      #      byte-identical, and writes exactly the statuses the sign-off
      #      granted. It plants five misbehaving writers first and requires
      #      itself to catch each one, so it cannot pass by doing nothing. It
      #      also checks the clause this step is NAMED for and never tested:
      #      that the build *reads* the file at all.
      #
      #   2. The step below runs the whole program end to end, which is the part
      #      1 cannot cover -- `write_outputs` being clean says nothing about
      #      some other code path in build.py reaching for the file.
      #
      # What was genuinely lost: the live build no longer proves on every push
      # that the writer behaves when driven by freshly fetched rows. That runs
      # on a schedule instead, in the `features-live` job below, where an EBI
      # outage costs a notification rather than a false accusation against a
      # commit.
      - name: The build's writer reads SIGNOFF.tsv and never writes it
        run: python features/build/check_writer.py

      # End to end, with PLF_OFFLINE set so `fetch` refuses the network instead
      # of hoping for it. On a clean runner the cache is empty (features/build/
      # .cache/ is gitignored), so every stage reports its source unavailable and
      # the build exits 3 having contributed no rows -- and `write_outputs` still
      # runs, which is the whole point. This is hermetic BY CONSTRUCTION: the
      # result is identical whether or not EBI is up.
      #
      # The existence of features.tsv is still what proves the writer ran, and it
      # still cannot pass vacuously when the build dies early. Only now it cannot
      # be made to die early by somebody else's outage.
      - name: The build program emits no SIGNOFF.tsv, offline
        run: |
          # `rc=0; cmd || rc=$?`, not `cmd; rc=$?`. GitHub runs this under
          # `bash -e`, so a non-zero exit that is not part of a condition kills
          # the step at that line -- and offline the build exits 3 by design, so
          # the naive form would never reach a single assertion below and the
          # step would fail while reporting nothing. Exactly the vacuity this
          # step is built to refuse, arriving through the shell instead.
          rc=0
          PLF_OFFLINE=1 PLF_BUILD_DATE=1970-01-01 \
            python features/build/build.py --out /tmp/plf-out || rc=$?
          echo "the build exited $rc (3 = build-source-unavailable, expected offline)"
          test -e /tmp/plf-out/features.tsv \
            || { echo "::error::the build never reached its writer, so this step checked nothing"; exit 1; }
          # At any depth, and case-insensitively: the runner is ext4 but half the
          # contributors are on NTFS, where signoff.tsv IS SIGNOFF.tsv. The old
          # `test ! -e /tmp/plf-out/SIGNOFF.tsv` saw neither a subdirectory nor a
          # rename of case.
          found=$(find /tmp/plf-out -iname 'SIGNOFF.tsv' -print -quit)
          test -z "$found" \
            || { echo "::error::the build emitted $found into its output directory"; exit 1; }
          # `git diff` says NOTHING about a path git is not tracking, so while
          # features/SIGNOFF.tsv is untracked the check below exits 0 whatever
          # the build did to it. That is this step's third vacuity mode, and it
          # is live exactly when the control matters most: the moment the file
          # is added, renamed, or dropped from the index.
          git ls-files --error-unmatch features/SIGNOFF.tsv >/dev/null 2>&1 \
            || { echo "::error::features/SIGNOFF.tsv is not tracked by git, so the diff below would prove nothing"; exit 1; }
          git diff --exit-code -- features/SIGNOFF.tsv \
            || { echo "::error::the build modified features/SIGNOFF.tsv; a sign-off comes from a human, not from a program"; exit 1; }
          rm -rf /tmp/plf-out
          echo "the writer ran and the sign-off table is read-only to it"

      # features/SOURCING.md section 0.4. Fetches pLannotate's snapgene.csv at a
      # pinned immutable commit, asserts its sha256, measures containment
      # against our descriptions, and deletes it. No byte is committed: the
      # filename is in .gitignore and tools/hooks/pre-commit rejects the blob by
      # content hash, so a rename does not defeat it.
      #
      # Fails CLOSED. A network error exits 3 with `taint-gate-unavailable`,
      # because "could not check" and "checked and clean" are different results.
      # This step is the concrete evidence behind the project's central claim
      # that this database is not derived from SnapGene's list, and the NOTICE
      # discloses it -- so it has to exist, and it has to run.
      - name: Taint gate -- our descriptions vs pLannotate's snapgene.csv
        run: python features/build/taint_gate.py

      # The taint gate brought an unlicensed file onto the runner. Prove the
      # working tree is clean of it afterwards, by content and not by name.
      #
      # THE SECOND HALF IS WHAT MAKES THAT SENTENCE TRUE, and it was missing.
      # This step was `git status --porcelain` alone, which reports nothing
      # about an IGNORED path -- and `.gitignore` ignores `snapgene.csv` at any
      # depth, with no leading slash, so it matches in every directory. A
      # payload left in the tree under the file's own name was therefore the
      # one case this step could not see: `git status --porcelain` printed
      # nothing and the step echoed "working tree clean". A step named
      # "Nothing from the taint gate survived", claiming in this comment to
      # check by content, was checking by name and missing the only name that
      # matters. `--ignored` is not the fix on its own: `target/` is present by
      # then and would fail the step on every run.
      #
      # So: half one is the dirty-tree check, unchanged. Half two hashes every
      # file in the tree -- tracked, untracked and ignored alike, since it asks
      # the filesystem and not git -- and compares each against the pinned
      # sha256, which is the same constant `tools/hooks/pre-commit` compares
      # staged blobs against. A rename defeats neither half.
      #
      # `target/` is the one exclusion, and it is a scoped claim rather than a
      # hidden one: it is cargo's output, it is gigabytes, it is written by a
      # build step that ran before the gate, and `features/build/taint_gate.py`
      # cannot put anything there -- it fetches into `tempfile.mkdtemp()`,
      # outside the repository entirely, and removes it in a `finally` before
      # refusing to exit clean if it survived. This sweep is the defence in
      # depth behind that, over the tree a person can leave a file in.
      #
      # The file count is asserted because this file already documents three
      # ways a step here passed while checking nothing. A sweep that enumerated
      # an empty tree would find no match and report success.
      - name: Nothing from the taint gate survived
        run: |
          PINNED=793631d9eebf721efae9e1d6cd483b1cbb62f5adad41174afa8f8b78b1342d5c

          git status --porcelain > /tmp/tree.txt
          if [ -s /tmp/tree.txt ]; then
            echo "::error::the working tree is dirty after the taint gate:"
            cat /tmp/tree.txt
            exit 1
          fi

          find . -path ./.git -prune -o -path ./target -prune -o -type f -print0 \
            | xargs -0 -r sha256sum > /tmp/tree-hashes.txt
          n=$(wc -l < /tmp/tree-hashes.txt)
          if [ "$n" -lt 100 ]; then
            echo "::error::the content sweep hashed only $n file(s); a checkout of this repository has 245 tracked files alone, so it enumerated almost nothing and proved nothing"
            exit 1
          fi
          # Matched as a whole field, not with `grep "^$PINNED  "`. sha256sum
          # separates the digest from the path with two spaces in text mode and
          # with " *" in binary mode, and which one it picks is a property of
          # the platform's coreutils. The two-space form was written first and
          # measured NOT to fire against a planted file, because the sweep had
          # emitted the binary form. A comparison that silently depends on
          # whitespace is how this step got here.
          awk -v p="$PINNED" '$1 == p' /tmp/tree-hashes.txt > /tmp/tainted.txt
          if [ -s /tmp/tainted.txt ]; then
            echo "::error::a file in the working tree has pLannotate's snapgene.csv contents, whatever it has been renamed to:"
            cat /tmp/tainted.txt
            exit 1
          fi
          echo "working tree clean, and none of the $n files in it hashes to the pinned blob"
