name: Release

# Cut a release for Windows, macOS and Linux from one tag. FOUR downloads, not
# three, because Windows ships x64 and arm64 separately -- see the matrix.
#
# WHAT THIS FILE DOES NOT CONTAIN, and deliberately: any knowledge of what goes
# into an archive. Every job below runs `tools/release.ps1`, which `tools/ci.ps1`
# exercises on all three legs of `ci.yml`'s `gate` job and on a developer
# machine, and then checks the result with `tools/check-archive.ps1`. There is no
# `tar -cf` here and no file list in YAML.
#
# THE FOURTH LEG IS NOT COVERED BY THAT SENTENCE, and the gap is stated here
# rather than left to be discovered. `ci.yml`'s `gate` job runs on
# windows-latest, ubuntu-latest and macos-latest -- three legs, all x64 or Apple
# Silicon, none of them Windows on ARM. So on `windows-arm64` the packaging
# path (`release.ps1` -> `check-archive.ps1` -> `build-msi.ps1` ->
# `check-msi.ps1`) is NOT rehearsed by the gate on any push. What rehearses it
# instead is the Windows leg of `ci.yml`'s `test` job, which since the ARM64
# port runs on `windows-11-arm` and drives those same four scripts on every
# pull request -- deliberately, because "a release workflow is not where to
# test a hypothesis" applies with more force to a platform nobody can build on
# locally than to one everybody can. What that leg does NOT run is the rest of
# the gate: the PE resource assertions, the differential oracles, the 8.3 alias
# case, the wasm steps. `ci.yml`'s header sets out exactly which. Do not write
# "ARM64 is covered by the gate" anywhere; it is not.
#
# That is not tidiness. Four of the licences this project ships under require
# their text to accompany every copy, and the packaging step has dropped them
# once already -- see the comments on `$notices` in tools/release.ps1. A file
# list in this workflow would be a second place for that to happen, in a
# language the local gate cannot run and on a machine nobody watches.
#
# WHAT IS SIGNED HERE AND WHAT IS NOT. The distinction is the whole point, and
# conflating the two would be a lie in either direction.
#
# NOT signed: the executables. There is no code-signing certificate for any of
# the three operating systems, and adding a second Windows architecture does
# not add a fourth story here -- no Authenticode certificate, no Apple
# Developer ID --
# and as of 2026-08-06 none is planned, so SmartScreen and Gatekeeper will say
# what they say and go on saying it. docs/RELEASING.md has the reasoning and the
# release notes tell the user what it costs on each platform. Nothing in this
# file changes that.
#
# SIGNED: `SHA256SUMS.txt`, the cross-platform manifest, with the Ed25519
# release key whose public half is compiled into `pl` and `polylinker` -- the
# two binaries that can check it -- as `pl_update::RELEASE_PUBLIC_KEY`. Not
# `pl-mcp`, not the Python module, not the wasm build: none of them depends on
# `pl-update`, so none carries the key or any code that could use it, and
# "compiled into every binary" is the sentence docs/RELEASING.md calls wrong.
#
# That is a different claim from code signing and a much narrower one: it says
# these bytes came from whoever holds the release key, and it says nothing at
# all to an operating system that has never heard of that key.
#
# It exists so that requirements 2 and 3 of the four docs/RELEASING.md sets for
# any updater this project ever grows CAN be met -- a signature over the
# download, checked against a key that was compiled in rather than fetched.
# Precisely: those two are requirements on an updater, and what this produces is
# the material one would need. Nothing HERE downloads or replaces anything.
# Saying "this workflow meets requirements 2 and 3" would be the kind of claim
# docs/RELEASING.md exists to stop.
#
# Since 2026-08-06 an updater that meets all four does exist, in
# `crates/pl-update`, and it is reachable from two places: the `pl update` verb,
# and a switch in the desktop app that ships off. Neither runs unattended and
# neither installs anything. docs/RELEASING.md's "The decision to expose it" is
# the review that allowed them, and the release notes now say "no auto-updater"
# rather than "no updater" because the second had stopped being true. This
# workflow's job is unchanged either way: produce the signed manifest, and be
# able to say so without overstating it.
#
# ONE THING DID CHANGE HERE, and it is a change in consequence rather than in
# code. `SHA256SUMS.txt.sig` was material nobody read; it is now the file
# `pl update` refuses a release without. A tag published without a valid
# signature is no longer merely undocumented -- it is a release no user can
# update to, and the failure surfaces on their machine rather than in this log.
#
# The archives and the MSI are covered through the manifest rather than
# individually: the manifest names each file and its SHA-256, so the chain from
# the compiled-in key to a downloaded file is signature -> manifest -> digest,
# and it is only a chain if both links are checked.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. The one job that needs to write asks for it itself.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # NOTE THE ABSENCE OF `RUSTFLAGS: -D warnings`, which ci.yml sets on its
  # `test`, `msrv`, `wasm` and `oracles` jobs. Lint is CI's job and it has
  # already run on this commit. Here it would mean a new warning in a dependency
  # -- or a rustc release with a new lint -- failing a release build of code that
  # compiles and works, at the one moment when the tag has already been pushed
  # and cannot be un-pushed.
  #
  # It was at ci.yml's WORKFLOW level until 2026-08-09, which is a second and
  # heavier reason: cargo does not merge a RUSTFLAGS environment variable with
  # `[target.<triple>] rustflags` from .cargo/config.toml, it REPLACES them, so
  # at workflow level it reached the Windows `gate` job and discarded
  # `-C target-feature=+crt-static` -- putting a VC++ redistributable dependency
  # back into binaries built there. This file has never set the variable, so no
  # shipped binary was ever affected. See the note in ci.yml's `env:` block for
  # the measurement.

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Four independent artifacts. One platform failing should not hide
      # whether the other three built.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
          # macos-latest is Apple Silicon. The x86_64 slice is CROSS-COMPILED
          # here and joined with `lipo` rather than built on a second, Intel
          # runner: `macos-*-intel` and the `-large` images are billed even for
          # public repositories, and a universal binary is one download that
          # works on every Mac in a lab rather than a choice the user has to get
          # right. It costs a second full LTO build and roughly doubles the size
          # of the three executables. See docs/RELEASING.md.
          - os: macos-latest
            label: macos-universal

          # ----------------------------------------------------------- ARM64
          #
          # A SEPARATE DOWNLOAD, and the macOS entry above is precisely why it
          # has to be. That entry pays a second full LTO build to spare the user
          # a choice, and it can, because Mach-O holds two slices in one file
          # and `lipo` puts them there. PE holds one. There is no fat-binary
          # format on Windows, no `lipo`, and no supported way to make
          # `pl.exe` mean two architectures -- so the cost the macOS reasoning
          # buys off cannot be bought off here at any price. A Windows reader
          # picks x64 or arm64. What this file owes them in exchange is that
          # both choices exist, that both carry an MSI rather than the ARM
          # reader being handed a zip and told to cope, and that the names make
          # the choice obvious: `polylinker-<v>-windows-arm64.{zip,msi}`.
          #
          # The one thing it is cheaper than macOS at: no second build. This is
          # one native build on one runner, not a cross-compile joined to
          # anything.
          #
          # NATIVE, AND THAT IS A DECISION RATHER THAN A DEFAULT. rustc will
          # cross-compile `aarch64-pc-windows-msvc` library crates from an x64
          # Windows machine, but every BINARY in this workspace fails there with
          # "linker `link.exe` not found" unless the ARM64 MSVC linker is
          # installed -- measured on the maintainer's machine, which does not
          # have it. So a cross-compiled ARM64 release would be an artifact that
          # had never been linked on, let alone run on, the architecture it
          # claims. Worse, the three things this job does AFTER packaging --
          # `check-archive.ps1` over the produced zip, an `msiexec` install in
          # both scopes, and the uninstall assertions -- all execute the
          # artifact's own environment and cannot be done from an x64 host at
          # all. `windows-11-arm` is a GitHub-hosted image and is free for
          # public repositories, which this one is.
          #
          # A LABEL THAT DOES NOT RESOLVE CANNOT PUBLISH, whatever GitHub does
          # with it. This is asserted from this file rather than from a belief
          # about the scheduler: the exact presentation of an unknown `runs-on`
          # -- immediate error, or a job that queues until it times out -- is
          # NOT verified here and must be read off the first run. What is
          # verified is that neither presentation can produce a release. A job
          # that does not run produces no artifact; `if-no-files-found: error`
          # on the two upload steps refuses an empty one; `needs: build` holds
          # the publish job behind it; and the publish job checks every one of
          # the four archives and both MSIs BY NAME, so a missing
          # `windows-arm64` file is a thrown error and not a shorter release
          # page. `fail-fast: false` means the other three still build and can
          # still be diagnosed, which is the whole reason it is set.
          - os: windows-11-arm
            label: windows-arm64

    steps:
      - uses: actions/checkout@v4

      # THE TAG AND Cargo.toml MUST AGREE, and this runs before anything is
      # built so the answer arrives in one minute rather than twenty.
      #
      # `release.ps1` reads the version out of Cargo.toml and nowhere else, so
      # a tag of v0.2.0 on a tree that still says 0.1.0 would publish four
      # archives called polylinker-0.1.0-* under a release called v0.2.0, and
      # every one of them would carry the wrong number in its own manifest.
      - name: The tag names the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = ''
          foreach ($line in (Get-Content 'Cargo.toml')) {
              if ($line -match '^\s*version\s*=\s*"([^"]+)"') { $version = $Matches[1]; break }
          }
          if (-not $version) { throw 'could not read the version out of Cargo.toml' }
          if ($tag -ne "v$version") {
              throw "the tag is $tag but Cargo.toml says $version. Bump Cargo.toml and re-tag; do not rename the tag."
          }
          Write-Host "$tag matches Cargo.toml $version"

      # No `targets:` here. The second Apple triple is added by `rustup target
      # add` in the macOS step below instead, so the matrix does not have to
      # carry an empty string for the two platforms that need nothing -- and so
      # this workflow does not depend on how the action treats one.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.label }}

      # eframe needs these to BUILD on Linux; the other two platforms ship
      # their own windowing.
      #
      # Copied verbatim from ci.yml, INCLUDING libgtk-3-dev, which a read of
      # Cargo.lock says is not actually needed -- there is no gtk crate anywhere
      # in the graph, and rfd reaches the file dialog through the XDG portal
      # over Wayland. Dropping it belongs in ci.yml, where a wrong guess costs a
      # red build on a pull request. A release workflow is not where to test a
      # hypothesis: the tag is already pushed by the time this runs.
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      # ---------------------------------------------------------------- macOS
      - name: Build both macOS slices and join them
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          # Both slices are built explicitly by triple, including the runner's
          # own, so `target/universal` is assembled from two directories that
          # are named the same way and neither is `target/release`. PyO3's abi3
          # feature is what makes the x86_64 half work without a matching Python
          # interpreter on this machine: an abi3 extension links against the
          # stable ABI and needs no target libpython.
          cargo build --release --workspace --locked --target aarch64-apple-darwin
          cargo build --release --workspace --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          for f in pl polylinker pl-mcp libpolylinker.dylib; do
            lipo -create -output "target/universal/$f" \
              "target/aarch64-apple-darwin/release/$f" \
              "target/x86_64-apple-darwin/release/$f"
          done
          for f in pl polylinker pl-mcp libpolylinker.dylib; do
            echo "== $f"
            lipo -info "target/universal/$f"
          done

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: pwsh
        # -SkipBuild is safe here and only here: the step above built both
        # slices from this checkout thirty seconds ago, and release.ps1 refuses
        # -SkipBuild without an explicit -BinDir precisely so it cannot be used
        # against a stale target/release.
        run: |
          ./tools/release.ps1 -Out dist -BinDir target/universal -SkipBuild -PlatformLabel macos-universal

      # -------------------------------------------------------- Windows/Linux
      - name: Package
        if: runner.os != 'macOS'
        shell: pwsh
        run: ./tools/release.ps1 -Out dist

      # ---------------------------------------------------------------- Linux
      #
      # WHAT THE LINUX BINARY ACTUALLY REQUIRES, measured rather than assumed,
      # and asserted against what README-LINUX.txt tells the user.
      #
      # glibc is backward but not forward compatible, so the highest GLIBC_x.y
      # symbol version the binaries reference IS the floor: below it they do not
      # start, and the error is a bare "version `GLIBC_2.xx' not found". That
      # number is a property of the runner image, which GitHub upgrades on its
      # own schedule, so a claim written into a text file goes stale silently
      # and the first person to find out is a user on an older cluster.
      #
      # The claimed floor is read out of README-LINUX.txt rather than repeated
      # here: one copy, and the file that makes the promise is the file that
      # gets checked.
      - name: The glibc floor, measured and checked against README-LINUX.txt
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          claimed=$(grep -oE 'glibc [0-9]+\.[0-9]+' tools/readme/README-LINUX.txt | head -1 | awk '{print $2}')
          if [ -z "$claimed" ]; then
            echo "::error::tools/readme/README-LINUX.txt no longer states a glibc version, so nothing here can be checked against it"
            exit 1
          fi
          required=$(for f in dist/pl dist/polylinker dist/pl-mcp dist/polylinker.so; do
              readelf -V "$f" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' || true
            done | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "runner glibc: $(ldd --version | head -1)"
          echo "highest GLIBC_ symbol version required by the artifacts: $required"
          echo "README-LINUX.txt claims: $claimed"
          if [ -z "$required" ]; then
            echo "::error::found no GLIBC_ version references at all; this check measured nothing"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$claimed" "$required" | sort -V | tail -1)" != "$claimed" ]; then
            echo "::error::these binaries need glibc $required but README-LINUX.txt promises they run on $claimed. Update README-LINUX.txt, or pin the runner to an older image."
            exit 1
          fi
          {
            echo "## Linux runtime requirements"
            echo
            echo '```'
            echo "glibc floor: $required  (runner: $(ldd --version | head -1))"
            echo
            for f in dist/pl dist/polylinker dist/pl-mcp dist/polylinker.so; do
              echo "== $f"
              readelf -d "$f" | grep NEEDED || echo "  (no DT_NEEDED beyond the loader)"
            done
            echo '```'
            echo
            echo "Anything the GUI opens with dlopen -- X11, xkbcommon, Wayland, EGL/GL --"
            echo "will NOT appear above. That is the point of recording it: the DT_NEEDED"
            echo "list is the part that is a hard link-time fact."
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------- every platform
      #
      # The archive is checked from the outside, as a downloader receives it:
      # its own SHA256SUMS.txt is verified against the bytes inside it, and the
      # licence set is asserted by name and by count. `release.ps1` builds
      # `dist/` correctly; this is the only thing that says the ARCHIVE is what
      # `dist/` was. That gap is where the licences went missing before.
      - name: Check the archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' }
          if ($archive.Count -ne 1) { throw "expected exactly one archive in dist/, found $($archive.Count)" }
          ./tools/check-archive.ps1 -Archive $archive.FullName
          if ($LASTEXITCODE -ne 0) { throw 'the archive failed its check' }

      - name: Show the manifest
        shell: pwsh
        run: Get-Content dist/SHA256SUMS.txt

      # -------------------------------------------------------------- Windows
      #
      # THE MSI, ON BOTH WINDOWS LEGS. Built inside this job rather than in a
      # matrix leg of its own, because it needs the dist/ this job has just
      # produced and verified, and because tools/ci.ps1 asserts the shape of
      # this matrix (it asserted three runners and three labels; the ARM64 leg
      # requires that assertion to be widened to four -- if it has not been,
      # this file is right and the gate step is what needs the edit, because a
      # published `windows-arm64` download with no matching matrix entry is not
      # a state this workflow can reach).
      #
      # `runner.os` is `Windows` on both windows-latest and windows-11-arm, so
      # every step below runs twice across the matrix, once per architecture,
      # and neither is a special case in YAML. The architecture is not named
      # here at all -- see the note on the build step.
      #
      # WiX is a RELEASE-time dependency only. Nothing about `cargo build`,
      # `cargo test` or the rest of tools/ci.ps1 needs it, and a contributor
      # without a .NET SDK still runs a complete gate: the MSI steps skip
      # themselves when `wix` is absent rather than failing.
      #
      # UNVERIFIED ON ARM64, AND DELIBERATELY NOT GATED. The `windows-11-arm`
      # image does not preinstall a WiX toolset -- the image manifest lists WiX
      # among the tools it does not carry -- so this step is the only thing that
      # puts one there. WiX has supported ARM64 natively since v4 and ships as
      # an architecture-independent .NET tool, which is why this is expected to
      # work; but "expected" is the honest word until a run says otherwise, and
      # it has not run yet. It is therefore left UNCONDITIONAL on both Windows
      # legs on purpose: if `dotnet tool install` cannot serve an arm64 host,
      # the correct outcome is a red install step naming WiX, not an `if` that
      # quietly turns the ARM64 MSI into something nobody builds. A skip here
      # would be the failure this repository has shipped nine fixes for.
      #
      # The version is pinned. An installer that changes shape because a
      # toolchain published a new minor is not reproducible, and the MSI is the
      # artifact where that matters most.
      - name: Install the WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'installing wix failed' }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'adding the WiX UI extension failed' }
          wix --version

      - name: Build the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        # -Out msi, never dist/. Three separate set-equality checks compare
        # dist/ against the manifest and exclude only SHA256SUMS.txt, *.zip and
        # *.zip.sha256, so an .msi left in dist/ would be swept into the
        # manifest and then into the zip, roughly doubling the download.
        #
        # NO ARCHITECTURE ARGUMENT, AND THAT IS THE POINT. The invocation is
        # byte-identical on both Windows legs. `build-msi.ps1` already takes its
        # entire file list from `dist/SHA256SUMS.txt` rather than from a second
        # list -- that is what the comment above about the manifest is defending
        # -- and `tools/release.ps1:658` writes `platform: <label>` into that
        # same manifest, derived from the machine's real OSArchitecture. So the
        # architecture is already in the one file the MSI builder reads, and
        # putting `-arch` in this YAML would be a second copy of it in a
        # language the local gate cannot run: exactly the mistake the header of
        # this file exists to refuse. `build-msi.ps1` must read it from there
        # (it hard-coded `'-arch', 'x64'` and the x64 MSI name before the ARM64
        # port), and the step below is what catches it if it has not.
        run: ./tools/build-msi.ps1 -Dist dist -Out msi

      # THE INSTALLER SAYS WHICH ARCHITECTURE IT IS, AND IS ASKED.
      #
      # Two Windows legs now write into the same artifact store, so a
      # `build-msi.ps1` that still hard-codes the x64 name would have both of
      # them produce `polylinker-<v>-windows-x64.msi`. The publish job downloads
      # with `merge-multiple: true`, which flattens by filename -- so one of the
      # two would overwrite the other and the release page would carry one MSI
      # under a name that is right for at most one architecture, with nothing
      # anywhere reporting it. That is a silent wrong file, which is worse than
      # a missing one.
      #
      # THE NAME IS NOT ENOUGH, so the package is asked what it thinks it is. An
      # MSI's Template summary property carries the platform WiX was given by
      # `-arch`, and an ARM64 Windows will happily install an x64 package
      # through emulation -- so `check-msi.ps1` below would pass, the payload
      # inside really would be the ARM64 binaries, and the only wrong thing
      # would be the installer's own declaration of itself. Nothing else in this
      # workflow can see that. Reading it here is one COM call and it is the
      # only place the `-arch` flag's actual effect is observed rather than
      # assumed.
      #
      # HOW IT FAILS: build the ARM64 leg with `build-msi.ps1` unchanged and
      # this step reports `polylinker-0.10.3-windows-x64.msi` where
      # `windows-arm64` was expected, or a Template of `x64;1033` where `Arm64`
      # was expected. Both were the state of the tree when the ARM64 port began.
      # It also refuses to pass on an unreadable Template rather than treating
      # "read nothing" as "read something matching".
      - name: The MSI is named and stamped for this architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $label = '${{ matrix.label }}'
          $version = ''
          foreach ($line in (Get-Content 'dist/SHA256SUMS.txt')) {
              if ($line -match '^version:\s*(\S+)') { $version = $Matches[1]; break }
          }
          if (-not $version) { throw 'dist/SHA256SUMS.txt carries no version: line, so this step could check neither name' }

          $msi = @(Get-ChildItem msi -Filter *.msi)
          if ($msi.Count -ne 1) { throw "expected exactly one .msi, found $($msi.Count)" }
          $want = "polylinker-$version-$label.msi"
          if ($msi[0].Name -ne $want) {
              throw ("the MSI is called $($msi[0].Name) and this leg builds $label, so it should be $want. " +
                     'tools/build-msi.ps1 derives the name from the platform: line of dist/SHA256SUMS.txt; ' +
                     'if it still hard-codes windows-x64 then both Windows legs produce the same filename and ' +
                     'the publish job merges one over the other.')
          }

          # Parameterised COM properties are not reachable through PowerShell's
          # normal property syntax, hence InvokeMember. Property 7 is PID_TEMPLATE.
          $inst = New-Object -ComObject WindowsInstaller.Installer
          $si = $inst.GetType().InvokeMember('SummaryInformation', 'GetProperty', $null, $inst, @($msi[0].FullName, 0))
          $template = $si.GetType().InvokeMember('Property', 'GetProperty', $null, $si, @(7))
          if ([string]::IsNullOrWhiteSpace($template)) {
              throw 'the MSI has an empty Template summary property, so this step read nothing and proved nothing about its architecture'
          }
          # `x64;1033`, `Arm64;1033`. The platform is everything before the
          # first semicolon; the rest is the language list.
          $platform = ($template -split ';')[0].Trim()
          $wantPlatform = switch ($label) {
              'windows-x64'   { 'x64' }
              'windows-arm64' { 'Arm64' }
              default         { throw "no MSI platform is defined for the label $label" }
          }
          if ($platform -ne $wantPlatform) {
              throw ("the MSI declares itself for '$platform' and this leg builds $label, which needs '$wantPlatform'. " +
                     "tools/build-msi.ps1 passes WiX its -arch; an ARM64 Windows installs an x64 package under emulation, " +
                     'so nothing else in this workflow would have noticed.')
          }
          Write-Host "$($msi[0].Name) declares Template '$template'"

      - name: Install the MSI, check it, uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        # The real oracle: an actual msiexec install, assertions against the disk
        # and the registry, an actual uninstall, and assertions that nothing
        # survived it.
        #
        # BOTH SCOPES, and the per-user one first because it is the one readers
        # get by default. Testing only per-machine is what let an install
        # directory that a non-administrator cannot write to survive review: the
        # package writes every registry value with Root="HKMU", so the two scopes
        # exercise genuinely different code paths in Windows Installer.
        run: |
          $msi = Get-ChildItem msi -Filter *.msi
          if ($msi.Count -ne 1) { throw "expected exactly one .msi, found $($msi.Count)" }
          ./tools/check-msi.ps1 -Msi $msi[0].FullName -Dist dist -PerUser
          if ($LASTEXITCODE -ne 0) { throw 'the MSI failed its check in the per-user scope, which is the default one' }
          ./tools/check-msi.ps1 -Msi $msi[0].FullName -Dist dist
          if ($LASTEXITCODE -ne 0) { throw 'the MSI failed its check in the per-machine scope' }

      - uses: actions/upload-artifact@v4
        with:
          name: polylinker-${{ matrix.label }}
          # The archive and its sidecar only. Everything else in dist/ is
          # already inside the archive.
          #
          # THE MSI IS NOT LISTED HERE, and that is deliberate rather than an
          # omission. upload-artifact derives one search path per pattern and,
          # when there is more than one, roots the artifact at their least common
          # ancestor -- computed from the PATTERNS, not from what matched. Adding
          # `msi/*.msi` would move the root from `dist` up to the workspace, so
          # every file would arrive one directory deeper than the publish job
          # looks for it, and NOTHING would be published. The MSI gets its own
          # upload step below instead.
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          # THE LABEL IS IN THE ARTIFACT NAME, and it has to be now that two
          # legs reach this step. This read `polylinker-windows-msi`, which was
          # unambiguous while exactly one runner was Windows; with two, both
          # legs would claim the same artifact name and upload-artifact@v4
          # refuses a second upload under a name that already exists -- so the
          # ARM64 leg (or whichever finished second) would fail here, having
          # built and verified a perfectly good installer. The archives above
          # were already labelled this way; this is the same rule applied to the
          # file that was the exception.
          name: polylinker-${{ matrix.label }}-msi
          # Its own artifact, so its own root. Both patterns are under msi/, so
          # the files arrive at the top level of the artifact exactly as the
          # four archives do, and the publish job's download flattens them into
          # the same artifacts/ directory.
          path: |
            msi/*.msi
            msi/*.msi.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish the release
    needs: build
    # A tag, and only a tag, publishes. `workflow_dispatch` runs the four
    # builds and leaves the artifacts on the run, which is what you want when
    # the question is "would this release build?" rather than "release it".
    # It is also the cheapest way to answer "does the windows-11-arm leg work
    # at all?" without pushing a tag that cannot be un-pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # NO SECRET, NO RELEASE. First step in the job, deliberately.
      #
      # `SHA256SUMS.txt` is what a future updater checks a download against, and
      # requirement 2 of docs/RELEASING.md is that it verifies a SIGNATURE and
      # not a checksum -- "a checksum fetched from the same server as the file
      # proves nothing about an attacker who controls the server". An unsigned
      # manifest on the release page is exactly that checksum. Publishing one
      # would not be a release with a missing extra; it would be a release the
      # updater contract cannot be met against, and the way that failure
      # presents itself later is a user whose updater refuses everything.
      #
      # So this fails the job rather than skipping the signing step. It is the
      # first step because the ones below assemble notes and then call
      # `gh release create`, and a release page that exists without a signature
      # is harder to withdraw than a red job. It CANNOT run before the four
      # builds -- `needs: build` is what this job is waiting on -- so the
      # feedback still costs a full build. Moving it earlier means putting the
      # secret in front of four runners on three operating systems to save
      # twenty minutes, which is the wrong trade for a step that only ever
      # fails when somebody has just rotated or removed the secret.
      #
      # The value is never used here, only measured. `-z` after stripping
      # whitespace, because a secret pasted with a stray newline is present but
      # a secret that is only whitespace is not, and `${{ secrets.X }}` for a
      # secret that does not exist expands to the empty string rather than to
      # anything that would fail on its own.
      - name: The release signing key is configured
        env:
          POLYLINKER_RELEASE_KEY: ${{ secrets.POLYLINKER_RELEASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${POLYLINKER_RELEASE_KEY//[[:space:]]/}" ]; then
            echo "::error::the POLYLINKER_RELEASE_KEY secret is not set on this repository, so SHA256SUMS.txt cannot be signed. Requirement 2 of docs/RELEASING.md -- a signature over the download, not a checksum from the same server -- cannot be met without it, and an unsigned manifest must not be published. Set the secret to the base64 of the 32 raw Ed25519 private key bytes and re-run this job."
            exit 1
          fi
          echo "the release signing key is configured (contents not shown)"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # FOUR ARCHIVES OR NOTHING.
      #
      # `fail-fast: false` above means one platform can fail while the others
      # succeed, which is right for diagnosis and wrong for publishing: a
      # release page listing Windows and Linux, with macOS quietly absent
      # because that job went red, is worse than no release page. `needs:` alone
      # does not cover it -- it covers the job failing, not the job producing
      # nothing.
      #
      # THE ARM64 ENTRY IS LOAD-BEARING FOR THE UPDATER, and more so than the
      # other three. `crates/pl-update/src/flow.rs:104-121` maps the running
      # platform to (label, extension) through a `#[cfg]` cascade with an
      # explicit `None` fallback, so before the ARM64 port `pl update` on an
      # ARM64 Windows matched nothing and DECLINED -- it failed closed, and told
      # the user to update by hand rather than offering them an x64 MSI. The
      # port adds an arm to that cascade. From the moment it lands, a release
      # published without `polylinker-<v>-windows-arm64.zip` turns that clean
      # decline into a 404 on the user's machine: `pl update` would name a file
      # the release page does not have. There is no way to notice that from
      # here except by refusing to publish, which is what the loop below does.
      # The new cfg arm and the new artifact are one change, not two.
      - name: Four platforms, checked again after transit
        id: check
        shell: pwsh
        run: |
          $version = ''
          foreach ($line in (Get-Content 'Cargo.toml')) {
              if ($line -match '^\s*version\s*=\s*"([^"]+)"') { $version = $Matches[1]; break }
          }
          $expected = @(
              "polylinker-$version-windows-x64.zip"
              "polylinker-$version-windows-arm64.zip"
              "polylinker-$version-linux-x64.tar.gz"
              "polylinker-$version-macos-universal.tar.gz"
          )
          foreach ($name in $expected) {
              $p = Join-Path 'artifacts' $name
              if (-not (Test-Path -LiteralPath $p)) { throw "$name was not produced. All four platforms publish together or none do." }
              # The sidecar, re-checked. Between release.ps1 computing it and
              # here lie an upload and a download.
              $side = "$p.sha256"
              if (-not (Test-Path -LiteralPath $side)) { throw "$name has no .sha256 sidecar" }
              $recorded = ((Get-Content $side -Raw) -split '  ')[0].Trim()
              $actual = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLower()
              if ($actual -ne $recorded) { throw "$name does not match its sidecar after transit through the artifact store" }
              # And the whole archive check again, on the bytes that will
              # actually be attached to the release.
              #
              # THE EXIT CODE IS CHECKED HERE, not left to the shell wrapper.
              # `check-archive.ps1` reports by exiting non-zero, and `exit` in a
              # called script returns to its caller rather than ending the job --
              # so with more than one archive in a loop, only the LAST one's
              # result survived in $LASTEXITCODE. A failure on Windows followed
              # by two clean Unix archives would have published all three, and
              # with the ARM64 leg there is now a second Windows archive ahead
              # of them for the same bug to hide.
              ./tools/check-archive.ps1 -Archive $p
              if ($LASTEXITCODE -ne 0) { throw "$name failed its archive check" }
          }

          # BOTH MSIs, checked the same way minus the archive check -- they are
          # installers, not archives, and check-archive.ps1 would reject them
          # for having no manifest. Each was already installed, asserted and
          # uninstalled on its own Windows runner; what is verified here is that
          # the bytes survived the artifact store, which is the one thing that
          # happened since.
          #
          # They are in this step rather than merely globbed onto the release
          # because a missing MSI must fail the publish. The four archives
          # publish together or not at all, and the installer most Windows
          # readers will take is not a lesser member of that set -- which is now
          # true twice, since an ARM64 reader offered only a zip while the x64
          # reader gets an installer has been handed the worse half of a
          # decision nobody wrote down.
          #
          # BY NAME AND IN A LOOP, for the same reason the archives are: two
          # Windows legs write into one flattened artifacts/ directory, so
          # "there is an .msi here" is no longer a question worth asking. The
          # two names must both be present and must differ.
          $msiNames = @(
              "polylinker-$version-windows-x64.msi"
              "polylinker-$version-windows-arm64.msi"
          )
          foreach ($msiName in $msiNames) {
              $msiPath = Join-Path 'artifacts' $msiName
              if (-not (Test-Path -LiteralPath $msiPath)) { throw "$msiName was not produced by its Windows job" }
              $msiSide = "$msiPath.sha256"
              if (-not (Test-Path -LiteralPath $msiSide)) { throw "$msiName has no .sha256 sidecar" }
              $recorded = ((Get-Content $msiSide -Raw) -split '  ')[0].Trim()
              $actual = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash.ToLower()
              if ($actual -ne $recorded) { throw "$msiName does not match its sidecar after transit through the artifact store" }
          }

          # THE TWO INSTALLERS ARE NOT THE SAME BYTES. `merge-multiple: true`
          # flattens every artifact into one directory by filename, so a
          # build-msi.ps1 that produced identically named files on both legs
          # would have silently left one of them here twice -- and the loop
          # above would have passed, because both names would exist and both
          # would match a sidecar. That is precisely a check that cannot fail.
          # An x64 and an ARM64 installer of the same version differ in their
          # payload, so equal digests mean one leg's output was overwritten by
          # the other's and the release would ship the wrong installer to half
          # its Windows readers. The Windows job's own name-and-Template step
          # is the primary defence; this is the one that still holds if that
          # step is ever weakened.
          $digests = $msiNames | ForEach-Object {
              (Get-FileHash -LiteralPath (Join-Path 'artifacts' $_) -Algorithm SHA256).Hash.ToLower()
          }
          if ($digests[0] -eq $digests[1]) {
              throw ("$($msiNames[0]) and $($msiNames[1]) are byte-identical. Two architectures cannot produce " +
                     'the same installer, so one Windows leg overwrote the other in the artifact store and this ' +
                     'release would hand half its Windows readers the wrong package.')
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      # One manifest over the four downloads, so a user can verify the file
      # they took without opening it first. The per-archive SHA256SUMS.txt
      # inside each one covers the notices; this covers the archives.
      - name: The cross-platform manifest
        run: |
          set -euo pipefail
          cd artifacts
          rm -f SHA256SUMS.txt
          # The .msi is in this table too. The release notes tell the reader to
          # check what they downloaded against it, and the installer is the file
          # most Windows readers will download -- leaving it out would point
          # them at a table that cannot answer the question they have.
          sha256sum polylinker-*.zip polylinker-*.tar.gz polylinker-*.msi | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ------------------------------------------------------- the signature
      #
      # Ed25519 over the manifest, with the release key. 64 raw bytes beside it
      # as `SHA256SUMS.txt.sig` -- raw, not PEM and not detached-CMS, because
      # `pl_core::ed25519::verify` takes `&[u8; 64]` and the file a future
      # updater reads should be the bytes it verifies with nothing in between.
      #
      # THE PRIVATE KEY NEVER ENTERS THE WORKING TREE. It is reconstructed into
      # $RUNNER_TEMP, which is outside the checkout, and deleted by an
      # `if: always()` step below. Writing it into the repository would put it
      # one careless `git add -A`, one `upload-artifact` glob, or one packaging
      # step away from being published, and this workflow has three globs that
      # sweep whole directories. It is also never echoed: not the secret, not
      # the PEM, not the DER. `::add-mask::` is applied to the reconstructed
      # form as well, because GitHub masks the SECRET's own text and knows
      # nothing about a value derived from it.
      #
      # WHY THE KEY IS REBUILT AT ALL, rather than stored as a PEM. The secret
      # is the 32 raw private key bytes in base64 -- the smallest thing that IS
      # the key, with no encoding to get wrong when it is set or rotated. An
      # Ed25519 PKCS#8 DER is exactly that with a fixed 16-byte prefix in front
      # (`302e020100300506032b657004220420`: SEQUENCE, version 0, the id-Ed25519
      # AlgorithmIdentifier, and an OCTET STRING wrapping a 32-byte OCTET
      # STRING), because the key is fixed-length and nothing in the structure
      # varies. So the prefix can be a literal here and the whole conversion is
      # a concatenation. `printf '\xNN'` writes the prefix rather than `xxd -r`
      # or a hex-to-binary helper: the prefix is a constant in this file, so
      # nothing has to parse anything, and this step gains no tool dependency
      # beyond `openssl` and coreutils.
      #
      # THE SECRET IS MEASURED IN BYTES, not in base64 characters, and that is
      # a correction rather than a preference. The obvious check -- "48 bytes of
      # DER is exactly 64 base64 characters, so require 64" -- is wrong by one:
      # a 31-byte secret gives 47 bytes of DER, which is also 64 characters,
      # with a single `=` of padding. A rehearsal against a deliberately
      # truncated key produced exactly that and sailed past the length check
      # into `openssl`, which then said "Could not find private key" -- true,
      # useless, and pointing at the wrong file. Decoding once to count is
      # unambiguous and says what is actually wrong. The count of a fixed-length
      # key is not a secret; the bytes never leave the pipe.
      #
      # The 64-character assertion is kept as well, but for the other half of
      # the job: it checks the CONCATENATION -- prefix plus key, 48 bytes -- and
      # so would catch the prefix literal above being mistyped.
      #
      # `-rawin` is required and is what OpenSSL 3 added for Ed25519: it signs
      # the message itself rather than a digest of it, which is what RFC 8032
      # specifies (Ed25519 does its own hashing internally, twice). Signing a
      # SHA-256 of the manifest would produce a valid signature over the wrong
      # thing, and `pl_core::ed25519::verify` would then reject every release.
      - name: Sign the manifest
        env:
          POLYLINKER_RELEASE_KEY: ${{ secrets.POLYLINKER_RELEASE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/polylinker-release-key.pem"

          raw_bytes=$(printf '%s' "$POLYLINKER_RELEASE_KEY" | tr -d '[:space:]' | base64 -d | wc -c) || {
            echo "::error::POLYLINKER_RELEASE_KEY is not valid base64. It must be the base64 of the 32 RAW Ed25519 private key bytes -- not hex, not a PEM, not a PKCS#8 DER. Nothing about the value is shown here on purpose; check what was pasted into the secret."
            exit 1
          }
          if [ "$raw_bytes" -ne 32 ]; then
            echo "::error::POLYLINKER_RELEASE_KEY decodes to $raw_bytes bytes, not 32. The secret must be the base64 of the 32 RAW Ed25519 private key bytes -- not hex (that would be 64), not a PEM, not a PKCS#8 DER (that would be 48). Only the length is reported here; the value is not."
            exit 1
          fi

          der_b64=$( { printf '\x30\x2e\x02\x01\x00\x30\x05\x06\x03\x2b\x65\x70\x04\x22\x04\x20'
                       printf '%s' "$POLYLINKER_RELEASE_KEY" | tr -d '[:space:]' | base64 -d
                     } | base64 -w0 )
          echo "::add-mask::$der_b64"
          if [ "${#der_b64}" -ne 64 ]; then
            echo "::error::the 32-byte key and the 16-byte PKCS#8 prefix came to ${#der_b64} base64 characters instead of 64, so the prefix literal in this workflow is wrong"
            exit 1
          fi

          { echo '-----BEGIN PRIVATE KEY-----'
            echo "$der_b64"
            echo '-----END PRIVATE KEY-----'
          } > "$key"

          openssl pkeyutl -sign -rawin -inkey "$key" \
            -in artifacts/SHA256SUMS.txt -out artifacts/SHA256SUMS.txt.sig

          # An Ed25519 signature is 64 bytes and never anything else. A short or
          # empty file here would mean openssl succeeded at something other than
          # what this step is named after.
          bytes=$(wc -c < artifacts/SHA256SUMS.txt.sig)
          if [ "$bytes" -ne 64 ]; then
            echo "::error::the signature is $bytes bytes; an Ed25519 signature is 64"
            exit 1
          fi
          echo "signed artifacts/SHA256SUMS.txt -> SHA256SUMS.txt.sig ($bytes bytes)"

      # The key in the source IS the key in the binary.
      #
      # The step below verifies the signature against the public key it reads
      # out of `crates/pl-update/src/lib.rs`, so that the key doing the checking
      # is the key that ships rather than a second copy pasted into this file
      # where it could drift. It reads the base64 constant, and what a binary
      # actually carries is the byte array beside it. `tests/key.rs` re-encodes
      # the array and requires the two to agree; running it here means that
      # agreement is established on the commit being released, not on whatever
      # commit last ran ci.yml.
      #
      # Cheap: `pl-update` has no dependencies and no code, and needs none of
      # the Linux GUI libraries the build jobs install.
      - uses: dtolnay/rust-toolchain@stable

      - name: The base64 key in the source is the key compiled into the binaries
        run: cargo test -p pl-update --tests --locked

      # A SIGNATURE NOTHING CAN CHECK MUST NOT SHIP.
      #
      # Everything above can succeed and still produce a useless file: the
      # secret could be a valid Ed25519 key that is not THIS project's, the
      # manifest could be rewritten between signing and publishing, `openssl`
      # could be signing something other than what is read back. The signature
      # is therefore verified here, before `gh release create` runs, with the
      # public key and against the exact bytes that will be attached.
      #
      # THE PUBLIC KEY IS BUILT BY STRING CONCATENATION, no tools at all. An
      # Ed25519 SubjectPublicKeyInfo is the fixed 12-byte prefix
      # `302a300506032b6570032100` followed by the 32 public bytes, and 12 is
      # divisible by 3 -- so base64 of the pair is base64 of the prefix,
      # `MCowBQYDK2VwAyEA`, followed by base64 of the key with no re-encoding
      # and no padding seam between them. That identity is why
      # `RELEASE_PUBLIC_KEY_BASE64` is the constant this step reads and not the
      # hex one: hex would need a hex-to-binary tool, and this needs none.
      #
      # `sort -u` and the count of 1: the pattern must find the key and only the
      # key. Two different 44-character base64 tokens in that file and this step
      # would be choosing between them, so it refuses instead. The Rust test
      # `exactly_one_base64_key_appears_in_the_source_the_release_workflow_reads`
      # asserts the same property on every pull request, so this fires only if
      # somebody edited `src/lib.rs` and did not run the tests.
      #
      # The negative control is not decoration. A check that cannot fail proves
      # nothing, and `openssl pkeyutl -verify` printing "Signature Verified
      # Successfully" would look identical whether it was verifying anything or
      # not -- a mistyped `-sigfile`, a `-verify` that silently fell back, an
      # empty manifest. Re-running it against a manifest with one extra byte
      # must be refused, in the same job, with the same key and signature.
      - name: Verify the signature before anything is published
        id: sig
        run: |
          set -euo pipefail
          src=crates/pl-update/src/lib.rs
          pub_b64=$(grep -oE '[A-Za-z0-9+/]{43}=' "$src" | sort -u)
          found=$(printf '%s\n' "$pub_b64" | grep -c . || true)
          if [ "$found" -ne 1 ]; then
            echo "::error::expected exactly one base64 Ed25519 public key in $src, found $found. The release signature is verified against the key that ships in the binary, and this step will not guess which of several candidates that is. See the module doc in $src."
            exit 1
          fi

          pem="$RUNNER_TEMP/polylinker-release-key.pub.pem"
          { echo '-----BEGIN PUBLIC KEY-----'
            echo "MCowBQYDK2VwAyEA$pub_b64"
            echo '-----END PUBLIC KEY-----'
          } > "$pem"
          echo "the key compiled into these binaries:"
          openssl pkey -pubin -in "$pem" -noout -text

          # Is the secret this project's release key at all? The verification
          # below already fails if it is not, but "signature verification
          # failure" sends the reader looking at the manifest. This names the
          # cause. Deriving the public half of a private key leaks nothing.
          from_secret=$(openssl pkey -in "$RUNNER_TEMP/polylinker-release-key.pem" \
                          -pubout -outform DER | tail -c 32 | base64 -w0)
          if [ "$from_secret" != "$pub_b64" ]; then
            echo "::error::the POLYLINKER_RELEASE_KEY secret is a valid Ed25519 key, but not the one compiled into these binaries. Its public half is $from_secret and $src carries $pub_b64. Either the secret was rotated without updating pl-update, or pl-update was updated without rotating the secret; every binary already released trusts the constant in the source, so it is the secret that has to match it."
            exit 1
          fi

          openssl pkeyutl -verify -rawin -pubin -inkey "$pem" \
            -in artifacts/SHA256SUMS.txt -sigfile artifacts/SHA256SUMS.txt.sig

          tampered="$RUNNER_TEMP/tampered-manifest.txt"
          cp artifacts/SHA256SUMS.txt "$tampered"
          printf 'polylinker-evil.zip\n' >> "$tampered"
          if openssl pkeyutl -verify -rawin -pubin -inkey "$pem" \
               -in "$tampered" -sigfile artifacts/SHA256SUMS.txt.sig; then
            echo "::error::the verification above accepted a manifest with a line added to it, so it is not checking anything and the release must not be published"
            exit 1
          fi
          echo "signature verified, and a modified manifest was refused"

          # The release notes print the verification recipe, and the key in it
          # is this one -- the one that just verified the signature, read out of
          # the source. Hard-coding it into the notes template would be a third
          # copy, in the one place where being wrong is invisible until a reader
          # tries to follow the instructions and concludes the release is
          # forged.
          echo "pub_b64=$pub_b64" >> "$GITHUB_OUTPUT"

      # The private key leaves the runner here, whatever happened above.
      #
      # `if: always()` and not a trailing `rm` inside the signing step: a
      # failure anywhere between writing the PEM and the end of the job would
      # skip a trailing `rm`, and the runner's workspace and $RUNNER_TEMP are
      # both still readable by anything else running in the job. The runner is
      # ephemeral and is destroyed afterwards, which is a reason this is cheap
      # insurance and not a reason to skip it.
      #
      # The removal is checked. `rm -f` cannot fail loudly by design -- that is
      # what `-f` means -- so it would report success on a path that was never
      # what this workflow wrote to.
      - name: Remove the signing key from the runner
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/polylinker-release-key.pem"
          if [ -e "$RUNNER_TEMP/polylinker-release-key.pem" ]; then
            echo "::error::the reconstructed private key is still on the runner"
            exit 1
          fi
          echo "the reconstructed private key is gone"

      - name: Assemble the release notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
          TAG: ${{ github.ref_name }}
          # From the verify step, which read it out of crates/pl-update, so the
          # key printed in the notes is the key that verified the signature.
          RELEASE_KEY_BASE64: ${{ steps.sig.outputs.pub_b64 }}
        run: |
          set -euo pipefail
          # The template's leading HTML comment explains why it is a file and
          # not a heredoc. That is for whoever edits it, not for the release
          # page, so it is stripped rather than rendered invisibly into the body.
          sed -e '/^<!--/,/^-->/d' \
              -e "s/{{VERSION}}/$VERSION/g" -e "s/{{TAG}}/$TAG/g" \
            tools/release-notes.md > notes.md
          {
            echo
            echo '## Checksums'
            echo
            echo '```'
            cat artifacts/SHA256SUMS.txt
            echo '```'
            echo
            # A signature nobody is told how to check is decoration. The key is
            # printed here as well as compiled in, with the caveat that makes
            # the difference honest: a key taken from this page is only as
            # trustworthy as this page, which is the entire reason
            # docs/RELEASING.md requires the updater to use the compiled-in one.
            echo '### Signature'
            echo
            echo "\`SHA256SUMS.txt.sig\` is an Ed25519 signature over \`SHA256SUMS.txt\`, made by the release key. The executables themselves are **not** signed — see above — and this does not change that; it means the checksum table came from whoever holds the release key, so the table is worth checking a download against."
            echo
            echo 'To check it, with OpenSSL 3:'
            echo
            echo '```sh'
            echo 'cat > polylinker-release.pem <<EOF'
            echo '-----BEGIN PUBLIC KEY-----'
            echo "MCowBQYDK2VwAyEA$RELEASE_KEY_BASE64"
            echo '-----END PUBLIC KEY-----'
            echo 'EOF'
            echo 'openssl pkeyutl -verify -rawin -pubin -inkey polylinker-release.pem \'
            echo '  -in SHA256SUMS.txt -sigfile SHA256SUMS.txt.sig'
            echo 'sha256sum -c --ignore-missing SHA256SUMS.txt'
            echo '```'
            echo
            echo "The same key is compiled into \`pl\` and \`polylinker\` as \`pl_update::RELEASE_PUBLIC_KEY\` — those two and no others, because \`pl-mcp\`, the Python module and the wasm build cannot update anything and so carry neither the key nor any code that could use it. \`docs/RELEASING.md\` states it in full. Taking the key from this page is better than nothing and worse than taking it from a copy of Polylinker you already trust: whoever could replace the files here could replace the key here too."
            echo
            echo "Built from \`$GITHUB_SHA\` by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } >> notes.md
          cat notes.md

      # `gh`, which is preinstalled, rather than a third-party release action.
      # One less thing whose maintainer can push a new tag over an old one, in a
      # project whose entire pitch is that it fetches and executes nothing.
      #
      # `--verify-tag` refuses to create a release for a tag that does not exist
      # in the repository. To review before the world sees it, add `--draft`
      # here; that is a deliberate one-word change and not the default, because
      # a draft that nobody remembers to publish looks exactly like a release
      # that failed.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # SHA256SUMS.txt.sig is named explicitly and not swept up by a glob,
          # for the same reason the four archives are checked by name above: a
          # glob that matches nothing publishes a release without it, and a
          # release page whose manifest is unsigned is one that the updater
          # contract cannot be met against. `gh release create` fails on a
          # named asset that does not exist, so the absence is loud.
          test -s artifacts/SHA256SUMS.txt.sig
          gh release create "$TAG" \
            --title "Polylinker $TAG" \
            --notes-file notes.md \
            --verify-tag \
            artifacts/polylinker-*.zip \
            artifacts/polylinker-*.tar.gz \
            artifacts/polylinker-*.msi \
            artifacts/polylinker-*.sha256 \
            artifacts/SHA256SUMS.txt \
            artifacts/SHA256SUMS.txt.sig
