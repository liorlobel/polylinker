[workspace]
resolver = "2"
members = [
    "crates/pl-core",
    "crates/pl-draw",
    "crates/pl-enzymes",
    "crates/pl-abif",
    "crates/pl-clone",
    "crates/pl-features",
    "crates/pl-index",
    "crates/pl-scan",
    "crates/pl-primer",
    "crates/pl-design",
    "crates/pl-sanger",
    "crates/pl-gel",
    "crates/pl-doc",
    "crates/pl-py",
    "crates/pl-thermo",
    "crates/pl-fileio",
    "crates/pl-update",
    "crates/pl-wasm",
    "bins/pl",
    "bins/pl-mcp",
    "bins/pl-gui",
]

[workspace.package]
version = "0.10.2"
edition = "2021"
# Measured on 2026-08-06, having never been measured before. This said 1.82
# from the day the workspace was created, and nothing had ever compiled the
# tree with 1.82: every toolchain step in both workflows is
# `dtolnay/rust-toolchain@stable`. It was not an idle number either --
# `tools/readme/README-LINUX.txt` quotes it to the reader whose distribution is
# too old for the Linux binaries and who is therefore being told to build from
# source, which is the one reader for whom it decides anything.
#
# 1.82 does not reach a compiler at all: `indexmap 2.14.0` in `Cargo.lock` is
# edition 2024, and cargo 1.82 stops at the manifest with "feature
# `edition2024` is required". The floor is 1.92, bounded from both sides on
# x86_64-pc-windows-msvc: `cargo +1.92 check --workspace --locked` is clean
# under `-D warnings`, and 1.91.1 refuses before compiling anything -- "rustc
# 1.91.1 is not supported by the following packages", naming the eight egui
# 0.35 crates that `bins/pl-gui` pulls in.
#
# The `msrv` job in `.github/workflows/ci.yml` reads THIS line and installs
# exactly what it says, so the number and the compiler cannot drift apart
# again, and `tools/ci.ps1` holds the two files that quote it to a user to the
# same value. Raising it is a decision about whose machine can still build
# Polylinker, so it belongs in a commit that says so.
rust-version = "1.92"
license = "MIT OR Apache-2.0"
# liorlobel/polylinker, and the org half is the half that has been wrong before.
# `polylinker/polylinker` is not a typo for anything -- that organisation does
# not exist -- and the same wrong string in `pl-update`'s RELEASE_BASE_URL
# shipped in 0.1.2 and made `pl update` fail with a 404 against a URL that read
# perfectly. See CHANGELOG 0.1.3.
repository = "https://github.com/liorlobel/polylinker"

[workspace.dependencies]
pl-core = { path = "crates/pl-core", version = "0.10.2" }
pl-draw = { path = "crates/pl-draw", version = "0.10.2" }
pl-abif = { path = "crates/pl-abif", version = "0.10.2" }
pl-clone = { path = "crates/pl-clone", version = "0.10.2" }
pl-enzymes = { path = "crates/pl-enzymes", version = "0.10.2" }
pl-features = { path = "crates/pl-features", version = "0.10.2" }
pl-index = { path = "crates/pl-index", version = "0.10.2" }
pl-scan = { path = "crates/pl-scan", version = "0.10.2" }
pl-primer = { path = "crates/pl-primer", version = "0.10.2" }
pl-design = { path = "crates/pl-design", version = "0.10.2" }
pl-sanger = { path = "crates/pl-sanger", version = "0.10.2" }
pl-gel = { path = "crates/pl-gel", version = "0.10.2" }
pl-doc = { path = "crates/pl-doc", version = "0.10.2" }
pl-thermo = { path = "crates/pl-thermo", version = "0.10.2" }
pl-fileio = { path = "crates/pl-fileio", version = "0.10.2" }
# `pl-update` holds the compiled-in release public key and the updater that
# reads it -- docs/RELEASING.md's four requirements, met and tested.
#
# It had no caller until 2026-08-06, and the note here said that adding one was
# a decision rather than a plumbing change and must not arrive as one. It did
# not: the decision was made, reviewed and written down in docs/RELEASING.md's
# "The decision to expose it", and the two callers are `bins/pl` (the `pl
# update` verb) and `bins/pl-gui` (a switch that ships OFF). `bins/pl-mcp` still
# does not list it.
#
# What replaced "nothing calls it" as the load-bearing guarantee is narrower and
# is enforced rather than asserted: each of those two binaries may reach the
# network from exactly one place, and a test in each reads its own sources and
# fails if the crate is named anywhere else. If a third consumer ever appears
# here, it needs the same test before it needs this line.
pl-update = { path = "crates/pl-update", version = "0.10.2" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The wasm module is inlined into a single HTML file as base64, which inflates
# it by a third, so size matters more than the last few percent of speed.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
