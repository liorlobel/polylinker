[workspace]
resolver = "2"
members = [
    "crates/pl-core",
    "crates/pl-draw",
    "crates/pl-enzymes",
    "crates/pl-abif",
    "crates/pl-clone",
    "crates/pl-features",
    "crates/pl-index",
    "crates/pl-scan",
    "crates/pl-primer",
    "crates/pl-design",
    "crates/pl-sanger",
    "crates/pl-gel",
    "crates/pl-doc",
    "crates/pl-py",
    "crates/pl-thermo",
    "crates/pl-fileio",
    "crates/pl-wasm",
    "bins/pl",
    "bins/pl-mcp",
    "bins/pl-gui",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polylinker/polylinker"

[workspace.dependencies]
pl-core = { path = "crates/pl-core", version = "0.1.1" }
pl-draw = { path = "crates/pl-draw", version = "0.1.1" }
pl-abif = { path = "crates/pl-abif", version = "0.1.1" }
pl-clone = { path = "crates/pl-clone", version = "0.1.1" }
pl-enzymes = { path = "crates/pl-enzymes", version = "0.1.1" }
pl-features = { path = "crates/pl-features", version = "0.1.1" }
pl-index = { path = "crates/pl-index", version = "0.1.1" }
pl-scan = { path = "crates/pl-scan", version = "0.1.1" }
pl-primer = { path = "crates/pl-primer", version = "0.1.1" }
pl-design = { path = "crates/pl-design", version = "0.1.1" }
pl-sanger = { path = "crates/pl-sanger", version = "0.1.1" }
pl-gel = { path = "crates/pl-gel", version = "0.1.1" }
pl-doc = { path = "crates/pl-doc", version = "0.1.1" }
pl-thermo = { path = "crates/pl-thermo", version = "0.1.1" }
pl-fileio = { path = "crates/pl-fileio", version = "0.1.1" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The wasm module is inlined into a single HTML file as base64, which inflates
# it by a third, so size matters more than the last few percent of speed.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
