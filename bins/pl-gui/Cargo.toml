[package]
name = "pl-gui"
description = "Polylinker desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "polylinker"
path = "src/main.rs"

[dependencies]
pl-core.workspace = true
pl-design.workspace = true
pl-draw.workspace = true
pl-enzymes.workspace = true
pl-fileio.workspace = true
pl-index.workspace = true
pl-scan.workspace = true

# The GUI is the one place dependencies are accepted: it is distribution, not
# logic. The correctness crates above still have none, and everything this
# binary decides about a molecule it asks them.
#
# glow (OpenGL): a smaller tree, and it asks least of a lab machine's drivers.
#
# wgpu was tried and measured against this, on the suspicion that the Windows
# HiDPI sizing defect noted in main.rs was a GL surface problem. It is not —
# both backends report byte-identical geometry — and wgpu costs 6 MB of binary
# plus a Vulkan/DX12 driver requirement. Ruled out on evidence, not taste.
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",      # screen-reader support; not optional in a tool people rely on
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
rfd = "0.17"

# The icon face, and NOTHING about how it is installed: see `install_fonts` in
# src/main.rs, which builds `FontDefinitions` by hand rather than calling this
# crate's `add_to_fonts`.
#
# PINNED WITH `=`, WHICH IS NOT DECORATION. NOTICE records the sha256 of the
# .ttf this crate carries, and the whole point of recording a hash is that the
# hash and the bytes cannot drift apart. A caret range lets `cargo update` pull a
# future 0.13.x whose `res/*.ttf` differs, and the recorded hash would then
# describe a file nobody ships.
#
# `default-features = false` matters too. `default = ["regular"]`, and
# `Variant::font_bytes` is a `match` over `#[cfg(feature = ..)]` arms, so the
# feature list decides which `include_bytes!` calls exist at all. Only `bold` is
# enabled, so only res/Phosphor-Bold.ttf is in the binary — 495,308 bytes, not
# five faces' worth.
#
# AND BOLD IS NOT A TASTE. Phosphor Regular's 1,512 ligature rules include forty
# spelled entirely from the IUPAC nucleotide alphabet — `at`, `cat`, `tag`,
# `dna`, `scan` — because the icon names come from the icon set's own
# selection.json. Every non-regular variant suffixes the name with the variant,
# so Bold's rules need `a,t,-,b,o,l,d` and none of them can fire on a sequence
# row. That is defence in depth BEHIND the family isolation, not instead of it:
# all five faces still cover a-z at zero advance.
egui-phosphor = { version = "=0.13.0", default-features = false, features = [
    "bold",
] }
