[package]
name = "pl-gui"
description = "Polylinker desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "polylinker"
path = "src/main.rs"

[dependencies]
pl-abif.workspace = true
pl-clone.workspace = true
pl-core.workspace = true
pl-design.workspace = true
pl-doc.workspace = true
pl-draw.workspace = true
pl-enzymes.workspace = true
# THE TABLES WERE ALREADY IN THIS BINARY BEFORE THIS LINE EXISTED, and that is
# worth knowing before anyone weighs it: `pl-doc` depends on `pl-features` and
# its "Feature annotation" methods page calls `Db::builtin()`, so
# `features.tsv`, `provenance.tsv` and `SIGNOFF.tsv` were already `include_str!`d
# into polylinker.exe. The app shipped a page DESCRIBING an annotation it could
# not perform. What this line buys is the ability to run the annotator, not the
# data it runs over.
pl-features.workspace = true
pl-fileio.workspace = true
pl-gel.workspace = true
pl-index.workspace = true

# THE SAME DEFECT AS `pl-features` ABOVE, ONE CRATE OVER, closed the same way and
# on the day after. `pl-primer` was already linked into this binary: `pl-design`
# calls `find_bindings` from `specificity.rs` for the off-target prefilter, so
# the code shipped. What it did not have was a caller a USER could reach. The app
# could design a pair and could not answer the more ordinary question about an
# oligo you already have -- paste it, where does it land? -- which
# `pl primers <file> --primer SEQ` has answered since the crate was written.
#
# AND THE PARALLEL WITH `pl-features` IS EXACT, down to the shipped page. The
# help panel renders every `pl_doc::TOPICS` entry (`src/help.rs:215`, from the
# list itself rather than a hand-written one), and `pl-doc` carries a topic
# titled "Primer binding sites" whose methods paragraph describes a 3'-anchored
# seed of 14 bases, the footprint/tail split, and a Tm taken over the footprint
# alone. So this binary shipped a page describing a search it could not run --
# the same sentence the note above had to be written about feature annotation.
#
# So, as there: this line buys the ability to RUN the search from the Primers tab
# (`src/primers.rs`), not the engine, which was in the .exe either way.
pl-primer.workspace = true
pl-sanger.workspace = true
pl-scan.workspace = true
pl-thermo.workspace = true

# The update check, reached from exactly one module: `src/update.rs`.
#
# Listed apart from the others with a comment because it is a change in kind.
# Every crate above computes something about a molecule the user already had;
# this one can open a socket. It stays inert unless `settings::Layout::
# update_check` is switched on, which it is not out of the box, and even then it
# only ever asks for a version number -- this binary contains no code that
# downloads a release, on purpose.
#
# `only_the_update_module_can_reach_the_network` in src/main.rs's test module
# holds the "exactly one module". See docs/RELEASING.md, "What exists,
# precisely", for the decision.
pl-update.workspace = true

# The GUI is the one place dependencies are accepted: it is distribution, not
# logic. The correctness crates above still have none, and everything this
# binary decides about a molecule it asks them.
#
# glow (OpenGL): a smaller tree, and on an x64 desktop or laptop it asks least
# of a lab machine's drivers.
#
# THAT QUALIFIER WAS NOT THERE UNTIL 2026-08-16, AND THE SENTENCE WAS FALSE
# WITHOUT IT. Windows-on-ARM devices ship no OpenGL driver at all: the GPU
# exposes Direct3D and Vulkan, Windows answers a GL request with its own
# software renderer at OpenGL 1.1, and `egui_glow requires opengl 2.0+.` is
# where the program stops. OpenGL is the one graphics API that platform does
# not have, so there this backend asks the MOST of the drivers, not the least.
# Measured in a Windows-on-ARM guest reporting feature level 11_1 on WDDM 1.2,
# where Microsoft's OpenGL-on-Direct3D-12 compatibility pack cannot help either:
# it needs a Direct3D 12 device to translate onto, and that adapter has none.
#
# wgpu was tried and measured against this, on the suspicion that the Windows
# HiDPI sizing defect noted in main.rs was a GL surface problem. It is not —
# both backends report byte-identical geometry — and wgpu costs 6 MB of binary
# plus a Vulkan/DX12 driver requirement. Ruled out on evidence, not taste.
#
# THAT RULING IS ABOUT HiDPI AND IS NOT A RULING ABOUT ARM64, which it predates.
# It weighed 6 MB against a defect wgpu did not fix; it never weighed 6 MB
# against a platform that cannot open a window at all, and on Windows on ARM the
# "Vulkan/DX12 driver requirement" it counts as a cost is precisely the
# requirement that platform can meet. Whether to add wgpu as a fallback is open
# and is not decided here — what this file must stop doing is implying it was
# already settled against.
#
# Until it is settled the failure is at least no longer silent: see
# `report_startup_failure` in src/main.rs.
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",      # screen-reader support; not optional in a tool people rely on
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
rfd = "0.17"

# The icon face, and NOTHING about how it is installed: see `install_fonts` in
# src/main.rs, which builds `FontDefinitions` by hand rather than calling this
# crate's `add_to_fonts`.
#
# PINNED WITH `=`, WHICH IS NOT DECORATION. NOTICE records the sha256 of the
# .ttf this crate carries, and the whole point of recording a hash is that the
# hash and the bytes cannot drift apart. A caret range lets `cargo update` pull a
# future 0.13.x whose `res/*.ttf` differs, and the recorded hash would then
# describe a file nobody ships.
#
# `default-features = false` matters too. `default = ["regular"]`, and
# `Variant::font_bytes` is a `match` over `#[cfg(feature = ..)]` arms, so the
# feature list decides which `include_bytes!` calls exist at all. Only `bold` is
# enabled, so only res/Phosphor-Bold.ttf is in the binary — 495,308 bytes, not
# five faces' worth.
#
# AND BOLD IS NOT A TASTE. Phosphor Regular's 1,512 ligature rules include forty
# spelled entirely from the IUPAC nucleotide alphabet — `at`, `cat`, `tag`,
# `dna`, `scan` — because the icon names come from the icon set's own
# selection.json. Every non-regular variant suffixes the name with the variant,
# so Bold's rules need `a,t,-,b,o,l,d` and none of them can fire on a sequence
# row. That is defence in depth BEHIND the family isolation, not instead of it:
# all five faces still cover a-z at zero advance.
egui-phosphor = { version = "=0.13.0", default-features = false, features = [
    "bold",
] }
