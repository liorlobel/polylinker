[package]
name = "pl-gui"
description = "Polylinker desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "polylinker"
path = "src/main.rs"

[dependencies]
pl-core.workspace = true
pl-design.workspace = true
pl-draw.workspace = true
pl-enzymes.workspace = true
pl-fileio.workspace = true
pl-index.workspace = true
pl-scan.workspace = true

# The GUI is the one place dependencies are accepted: it is distribution, not
# logic. The correctness crates above still have none, and everything this
# binary decides about a molecule it asks them.
#
# glow (OpenGL): a smaller tree, and it asks least of a lab machine's drivers.
#
# wgpu was tried and measured against this, on the suspicion that the Windows
# HiDPI sizing defect noted in main.rs was a GL surface problem. It is not —
# both backends report byte-identical geometry — and wgpu costs 6 MB of binary
# plus a Vulkan/DX12 driver requirement. Ruled out on evidence, not taste.
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",      # screen-reader support; not optional in a tool people rely on
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
rfd = "0.17"
