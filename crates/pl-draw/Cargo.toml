[package]
name = "pl-draw"
# The description says "from one build" because the raster declines the
# stronger claim in its own header; see `src/lib.rs`, "What is guaranteed".
description = "Plasmid maps as SVG, PDF, EPS and PNG. Pure and deterministic: identical input gives identical bytes from one build."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Zero dependencies, like the rest of the correctness layer. An SVG writer is a
# string builder; taking a crate for it would buy nothing and cost auditability.
[dependencies]
pl-core.workspace = true
