[package]
name = "pl-index"
description = "The library index: a packed sequence store and the queries over it. Pure, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Zero dependencies, like the rest of the correctness layer -- and enforced
# rather than merely intended: `tools/ci.ps1` builds this crate for
# wasm32-unknown-unknown, which fails the moment a *dependency* that cannot
# build for wasm32, or a platform-specific std API, is added. It does not fail
# on a hand-written `std::fs` call -- wasm32-unknown-unknown compiles those
# through its `unsupported` platform layer -- so `tests/purity.rs` reads the
# source and fails on those. The I/O under crates/ lives in `pl-scan` and
# `pl-update`, and nowhere else.
[dependencies]
pl-core.workspace = true

[dev-dependencies]
# Tests only. The motif scan is cross-checked against `cut_positions`, which
# carries the Biopython oracle -- two implementations of one search, and the
# other one is already externally validated.
pl-enzymes.workspace = true
