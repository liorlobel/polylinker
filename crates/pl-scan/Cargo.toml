[package]
name = "pl-scan"
description = "Walking a folder and keeping a library index on disk. One of the two crates under crates/ that perform I/O; pl-update is the other."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Zero external dependencies, like everything else under crates/. The directory
